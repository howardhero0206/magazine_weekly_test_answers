<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ED Week 2+3 詳解</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E7EBEE; --card:#FDFDFC;
  --ink:#10202F; --ink-2:#56687A; --ink-3:#7C8B99;
  --rule:#C6D0D8; --pen:#17457E; --hl:#FFE773; --miss:#A34234;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
  --read:'Literata',Georgia,'Times New Roman',serif;
  --han:'PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;
  --maxw:1180px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--han);font-size:16px;line-height:1.75}
:focus-visible{outline:2px solid var(--pen);outline-offset:3px;border-radius:2px}

.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:var(--maxw);margin:0 auto;padding:14px 24px 0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.title{font-size:23px;font-weight:600;margin:0;line-height:1.3}
.meta{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin:4px 0 0;letter-spacing:.04em}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:12px 0 11px;margin-top:10px;border-top:1px solid var(--rule)}
.chip{font-family:var(--mono);font-size:12px;letter-spacing:.04em;border:1px solid var(--rule);background:transparent;color:var(--ink-2);padding:5px 10px;border-radius:999px;cursor:pointer;text-decoration:none;transition:border-color .15s,color .15s,background .15s}
.chip:hover{border-color:var(--pen);color:var(--pen)}
.chip.solid{margin-left:auto;border-color:var(--ink);color:var(--ink);font-weight:500}
.chip.solid:hover{background:var(--ink);color:var(--card)}

.wrap{max-width:var(--maxw);margin:0 auto;padding:28px 24px 96px;display:grid;gap:36px;grid-template-columns:minmax(0,1fr) 288px}
@media (max-width:1020px){.wrap{grid-template-columns:minmax(0,1fr);gap:44px}}

.sec{margin:0 0 48px;scroll-margin-top:136px}
.sec-head{display:flex;align-items:baseline;gap:12px;padding-bottom:9px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.sec-num{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--ink-3)}
.sec-label{font-size:18px;font-weight:600;margin:0}
.sec-score{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-left:auto}
.sec-inst{font-size:13.5px;color:var(--ink-2);margin:9px 0 0}

.bank{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin:16px 0 0}
@media (max-width:760px){.bank{grid-template-columns:repeat(2,1fr)}}
.bank-i{background:var(--card);padding:8px 10px;font-family:var(--read);font-size:14.5px}
.bank-i span{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-right:5px}
.bank-i.used{background:#F2F5F6;color:var(--ink-3)}

.passage{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--ink);padding:22px 26px;margin:18px 0 0;font-family:var(--read);font-size:16.5px;line-height:1.95;color:#1a2836}
.passage p{margin:0 0 1em}
.passage p:last-child{margin-bottom:0}
.blank{display:inline-block;min-width:70px;text-align:center;border:0;border-bottom:1.5px solid var(--ink);font-family:var(--mono);font-size:13px;color:var(--pen);cursor:pointer;background:none;padding:0 4px;line-height:1.4}
.blank:hover{background:rgba(23,69,126,.07)}
.blank.filled{font-family:var(--read);font-size:16.5px;color:var(--ink);border-bottom-color:transparent;min-width:0}
.blank sup{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-right:2px}
.zhbtn{display:block;margin:0 0 18px;background:var(--card);border:1px solid var(--rule);border-top:0;width:100%;text-align:left;padding:8px 26px;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--pen);cursor:pointer}
.zhbtn:hover{color:var(--ink)}
.zhbtn::after{content:' ▾'}
.zhbtn.on::after{content:' ▴'}
.zhbox{display:none;background:#F7F9FA;border:1px solid var(--rule);border-top:0;padding:18px 26px;margin:0 0 18px;font-size:15px;line-height:1.95;color:#22323F}
.zhbox.on{display:block}
.zhbox p{margin:0 0 .9em}
.zhbox p:last-child{margin:0}

.q{background:var(--card);border:1px solid var(--rule);margin:14px 0 0;scroll-margin-top:142px}
.q-top{padding:16px 22px 14px}
.q-tag{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.q-n{font-family:var(--mono);font-size:13px;font-weight:600}
.q-kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.prompt{font-size:14.5px;line-height:1.85;color:var(--ink-2);margin:0 0 11px;padding-left:11px;border-left:2px solid var(--rule)}
.stem{font-family:var(--read);font-size:16.5px;line-height:1.85;margin:0 0 13px;color:#1a2836}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:9px;font-family:var(--read);font-size:15.5px;line-height:1.6;padding:3px 0;color:#243342}
.opt-k{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);padding-top:2px;flex:none}
.reveal{display:block;width:100%;text-align:left;margin-top:14px;background:none;border:0;border-top:1px dashed var(--rule);padding:11px 0 0;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--pen);cursor:pointer}
.reveal:hover{color:var(--ink)}
.reveal::after{content:' ▾'}
.q.open .reveal::after{content:' ▴'}
.q.open .reveal{color:var(--ink-3)}

.body{display:none;border-top:1px solid var(--rule);background:#F7F9FA;padding:18px 22px 20px}
.q.open .body{display:block}
.ans{display:flex;align-items:baseline;gap:10px;margin:0 0 13px;flex-wrap:wrap}
.ans-k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink-3);flex:none;padding-top:2px}
.ans-v{font-family:var(--read);font-size:18px;font-weight:600}
.fills{list-style:none;margin:0 0 13px;padding:0}
.fill{display:flex;gap:11px;align-items:baseline;padding:7px 0;border-bottom:1px dotted var(--rule)}
.fill-k{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:none;width:26px}
.fill-w{font-family:var(--read);font-size:17px;font-weight:600;flex:none}
.fill-n{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.zh{font-size:15px;line-height:1.85;margin:0 0 14px;color:#22323F}
.why{font-size:14.5px;line-height:1.85;margin:0 0 4px;color:#22323F;border-top:1px solid var(--rule);padding-top:12px}
.lines{margin:0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.line{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14.5px;line-height:1.75;color:var(--ink-2)}
.line-k{font-family:var(--mono);font-size:12.5px;flex:none;width:28px;color:var(--ink-3);padding-top:2px}
.line.right{color:var(--ink)}
.line.right .line-k{color:var(--ink);font-weight:600}
.line.right .line-k::after{content:'✓';display:block;font-size:12px;line-height:1.3}
.line.wrong .line-k{color:var(--miss);opacity:.85}
.line.wrong .line-k::after{content:'✗';display:block;font-size:12px;line-height:1.3}
.evid{margin:15px 0 0;font-family:var(--read);font-size:14.5px;line-height:1.8;color:var(--ink-2);padding-left:13px;border-left:2px solid var(--hl)}
.evid span{font-family:var(--han);font-size:11px;letter-spacing:.14em;color:var(--ink-3);display:block;margin-bottom:3px}

.hl{background-image:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 90%,transparent 90%);background-repeat:no-repeat;background-size:0% 100%;transition:background-size .55s cubic-bezier(.2,.75,.3,1);border-radius:1px}
.hl.on{background-size:100% 100%}

.sample{margin:15px 0 0;border:1px solid var(--rule);border-left:3px solid var(--ink);background:var(--card);padding:16px 20px}
.sample p:not(.note-h){font-family:var(--read);font-size:15.5px;line-height:1.9;color:#1a2836;margin:0 0 1em}
.sample p:last-child{margin-bottom:0}
.bank.wide{grid-template-columns:1fr}
.bank.wide .bank-i{font-size:15px;line-height:1.7;padding:10px 14px}
.note{margin:15px 0 0;border:1px solid var(--rule);background:var(--card);padding:13px 16px}
.note-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.note-i{margin:0;padding:9px 0 0;border-top:1px dotted var(--rule)}
.note-i:first-of-type{border-top:0;padding-top:0}
.term{font-family:var(--read);font-size:16px;font-weight:600}
.pos{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin:0 6px}
.gloss{font-size:14.5px}
.ex{font-family:var(--read);font-size:14px;color:var(--ink-2);line-height:1.7;margin:3px 0 0;display:block}
.ex i{font-family:var(--han);font-style:normal;font-size:13px;color:var(--ink-3);display:block}

.side{position:sticky;top:136px;align-self:start;max-height:calc(100vh - 164px);overflow:auto;padding-right:4px}
@media (max-width:1020px){.side{position:static;max-height:none;scroll-margin-top:136px}}
.side-h{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin:0 0 3px}
.side-t{font-size:16px;font-weight:600;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.card-list{margin:0;padding:0;list-style:none}
.card-item{border-bottom:1px solid var(--rule);padding:11px 0}
.card-item a{display:block;text-decoration:none;color:inherit}
.card-item a:hover .term{background:var(--hl)}
.jump{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);float:right;padding-top:5px}
.side-note{font-size:12.5px;color:var(--ink-3);line-height:1.7;margin:16px 0 0}
.foot{max-width:var(--maxw);margin:0 auto;padding:0 24px 48px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  body{background:#fff;font-size:10.5pt}
  .top,.side,.reveal,.foot,.zhbtn{display:none!important}
  .wrap{display:block;max-width:none;padding:0}
  .q .body{display:block!important}
  .zhbox{display:block!important}
  .q{break-inside:avoid;border-color:#999;margin-bottom:9pt}
  .passage{break-inside:avoid}
  .hl{background-size:100% 100%!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <p class="eyebrow" id="brand"></p>
    <h1 class="title" id="examTitle"></h1>
    <p class="meta" id="examMeta"></p>
    <nav class="bar" id="nav"></nav>
  </div>
</header>

<div class="wrap"><main id="main"></main><aside class="side" id="side"></aside></div>
<p class="foot" id="foot"></p>

<script>
/* ==========================================================================
   ①  題目與詳解全部寫在下面的 EXAM 物件裡。要改題、加題、修字，只動這裡。

   section（大題）：{ id, label, score, instruction, bank?, groups: [...] }
   group（同一篇文章的題組）：{ passage?, zh?, questions: [...] }
       passage 裡寫 __7__ 就會變成可點的空格，數字對應題號。
       zh 是全文中譯，會做成可展開的按鈕。

   question 依題型三選一：
     選擇題   { n, kind, stem, options:{A..D}, answer:"B", translation, explain:{A..D}, evidence?, notes? }
     單一填答 { n, kind, stem, answerText:"prejudice", why, notes? }
     多格填答 { n, kind, prompt, stem, answers:[{k:"①", w:"字", note:"說明"}], notes? }
   ========================================================================== */
const EXAM = {
  brand: "English Digest Weekly Quiz",
  title: "Reading Test 詳解｜Week 2+3: Units 5–12 (Jul / Aug)",
  meta: "Instructor: Howard Chang　·　範圍：ED 雜誌 Jul.+Aug. Week 2+3　·　滿分 90 分",
  footer: "班級複習用",
  sections: [
  /* ===================== 一、綜合測驗 ===================== */
  {
    id:"cloze", label:"一、綜合測驗", score:"32% · 每題 2%",
    instruction:"兩篇短文，共 16 題。點文章裡的空格可直接跳到該題。答案：CADBC DAB ／ DBACB DCA",
    groups:[
    {
      passage:`When a heat wave arrives, most of us simply switch on a fan or an air conditioner. Wild animals enjoy no such convenience, yet the heat that __1__ inside a body must escape somehow, or the animal will not last the afternoon. Millions of years of evolution have therefore equipped desert and grassland species with cooling systems built into their own bodies. __2__, these systems rest on one of two principles: some animals throw off the heat they have already absorbed, while others prevent it from reaching them at all.

The first group turns the body itself into a radiator. Fennec foxes and jackrabbits, both of which live in burning deserts, are famous for their enormous ears. Because those ears are so large __3__ the rest of the body, blood vessels lying just beneath the skin can release warmth straight into the surrounding air. The hotter the day becomes, the more blood __4__ through these vessels, and the faster the animal cools down. The giraffe applies the same principle in a far less obvious way. Beneath each dark patch on its coat lies a network of blood vessels, so a coat that looks purely decorative may in fact be a set of tiny windows through which __5__ heat quietly escapes.

__6__, the second group never lets the heat arrive in the first place. Saharan silver ants are coated in tiny hairs that reflect sunlight away from their bodies and speed up the loss of warmth. __7__ their tiny size, these ants can hunt on sand hot enough to kill almost any other insect, though without that silver coat they would overheat within seconds. The Cape ground squirrel solves the problem with a far simpler tool: it flips its bushy tail forward over its head and carries a patch of portable shade wherever it goes.

Neither strategy is better than the other; each suits a particular body in a particular landscape. Engineers have begun to take notes. Roof paints modeled on the silver ant's coat bounce much of the sunlight that strikes them back into the __8__, and architects are studying the fennec fox's ear. The desert, it seems, solved our summer problem long before we did.`,
      zh:`熱浪來襲時，我們大多數人只要打開電扇或冷氣就好。野生動物沒有這種便利，然而在體內累積的熱必須以某種方式排出，否則這隻動物撐不過那個下午。因此，數百萬年的演化為沙漠與草原物種配備了內建於身體之中的降溫系統。整體而言，這些系統都建立在兩種原理之一：有些動物把已經吸收的熱排掉，另一些則根本不讓熱抵達身上。

第一類動物把身體本身變成一具散熱器。耳廓狐與長耳大野兔都棲息在酷熱的沙漠中，兩者都以牠們碩大的耳朵聞名。正因為那雙耳朵相對於身體其餘部分是如此之大，位於皮膚下方的血管便能把熱直接釋放到周圍的空氣中。天氣越熱，湧過這些血管的血液就越多，動物也降溫得越快。長頸鹿以一種遠不那麼明顯的方式運用了同樣的原理。在牠皮毛上每一塊深色斑紋的下方，都藏著一整片血管網絡，因此一身看似純粹裝飾的皮毛，實際上可能是一組小小的窗口，多餘的熱就從這些窗口悄悄逸散出去。

相對地，第二類動物根本不讓熱有機會抵達。撒哈拉銀蟻全身覆滿細毛，能把陽光從身上反射開，並加速熱的散失。儘管體型微小，這些螞蟻卻能在足以殺死幾乎任何其他昆蟲的滾燙沙地上獵食——但若沒有那身銀色外衣，牠們幾秒之內就會過熱。開普地松鼠則以更簡單的工具解決問題：牠把蓬鬆的尾巴往前翻到頭頂上，隨身帶著一小片可攜式的陰影。

兩種策略並無優劣之分；各自適合特定景觀中的特定身體。工程師已經開始向牠們取經。仿照銀蟻外衣所研發的屋頂塗料，能把大部分照射其上的陽光反彈回大氣中，而建築師則正在研究耳廓狐的耳朵。看來，沙漠早在我們之前就已經解決了我們的夏天難題。`,
      questions:[
        { n:1, kind:"動詞",
          options:{A:"overflows 溢出",B:"modifies 修改",C:"accumulates 累積",D:"calculates 計算"}, answer:"C",
          translation:"然而在體內累積的熱必須以某種方式排出。",
          explain:{
            A:"overflow 是「溢出（液體滿出容器）」，為不及物動詞，主詞須為容器或液體；熱不會「溢出」身體，它是被排掉的。",
            B:"modify 是「修改、調整」，受詞應為計畫、設計、行為。",
            C:"the heat that ______ inside a body 描述熱在體內「越積越多」的狀態，這正是後面 must escape somehow（必須設法排出）的前提——先有累積，才需要排出。",
            D:"calculate 是「計算」，主詞須為人或電腦。"
          },
          notes:[
            {term:"accumulate", pos:"vi. / vt.", gloss:"累積、堆積（n. accumulation）", ex:"Dust accumulates quickly in an empty house.", exZh:"空屋裡灰塵累積得很快。"},
            {term:"last", pos:"vi.", gloss:"撐得住、持續。will not last the afternoon 意為「撐不過那個下午」，此處為及物用法。"}
          ]},

        { n:2, kind:"轉承語",
          options:{A:"Overall 整體而言",B:"Besides 此外",C:"Otherwise 否則",D:"Meanwhile 同時"}, answer:"A",
          translation:"整體而言，這些系統都建立在兩種原理之一。",
          explain:{
            A:"空格後的句子把所有降溫系統歸納成 one of two principles（兩種原理之一），是一個「總括性」的陳述。Overall 正是用來帶出通則或總結。",
            B:"Besides 是「此外」，用於補充新的一項；但這句不是補充，而是把前面說的東西收攏歸類。",
            C:"Otherwise 是「否則」，須有一個條件在前面；前句只是陳述事實，沒有條件。",
            D:"Meanwhile 是「同時」，表兩件事並行發生，但此處沒有時間上的並列關係。"
          },
          notes:[
            {term:"Overall", pos:"adv.", gloss:"整體而言、大致上（＝In general／On the whole）", ex:"Overall, the response has been positive.", exZh:"整體而言，反應是正面的。"},
            {term:"rest on", pos:"phr. v.", gloss:"以…為基礎、取決於（＝be based on）", ex:"The whole case rests on one witness.", exZh:"整起案件都建立在一位證人身上。"}
          ]},

        { n:3, kind:"介系詞片語",
          options:{A:"in the face of 面對",B:"in contrast to 與…形成對比",C:"in terms of 就…而言",D:"in proportion to 相對於…的比例"}, answer:"D",
          translation:"正因為那雙耳朵相對於身體其餘部分是如此之大。",
          explain:{
            A:"in the face of 是「面對（困境、危險）」，後接的應是威脅或阻力，不是身體部位。",
            B:"in contrast to 是「與…相反」，強調兩者性質對立；但耳朵和身體不是對立的東西，這裡談的是大小比例。",
            C:"in terms of 是「就…方面而言」，用來限定討論的範圍，但句中已用 so large 說明程度，需要的是比較的基準。",
            D:"耳廓狐的耳朵之所以引人注目，是因為它「相對於身體比例」極大。in proportion to 正是表達這種比例關係，也解釋了為什麼散熱效率高——表面積相對於體積越大，散熱越快。"

    {
      passage:`Greenland is easier to admire than to imagine. It is the largest island on Earth, big enough to hold Taiwan more than fifty times over, and yet almost none of it is available for people to live on. More than eighty percent of the land __9__ in ice and snow, settlement is squeezed onto a narrow ribbon of coast. Yet the entire territory is home to fewer than 60,000 __10__. Denmark still handles foreign affairs, but Greenlanders govern themselves, and Inuit tradition, not Danish administration, sets the rhythm of daily life. What visitors soon discover is that the calendar matters here as much as the map: Greenland is really two countries sharing one coastline.

The first arrives in June. North of the Arctic Circle, the sun may remain above the horizon around the clock for weeks, and the landscape still glows gold at two in the morning, while hikers, kayakers, and whale watchers keep hours that would look absurd anywhere else. __11__, this endless brightness is harder to live with than it sounds. Travelers accustomed to normal day-night cycles often __12__ how heavily it presses on the body, and sleep becomes something that has to be scheduled rather than simply taken.

By late summer in the far north, the midnight sun gradually __13__ real darkness. Evenings turn long and starry, the Northern Lights move overhead in slow green sheets, and dog sledding and skiing replace kayaks and hiking boots. __14__, a landscape this powerful is not always gentle. Weather closes in without warning, small planes stay on the ground, and visitors can find themselves __15__ in a village of two hundred people, waiting days for the sky to clear.

What finally makes the island memorable, though, is smaller than any glacier. In Nuuk, the capital, brightly painted houses climb above the fjord, the National Museum tells the Inuit story in an Inuit voice, and kitchens serve seafood caught that morning beside musk ox. The community is tightly bound, and its respect for the land is deep enough to shape architecture, diet, and conversation alike. Greenland is __16__ worth seeing at least once in a lifetime, not because it is beautiful, though it is, but because it quietly rearranges your sense of scale.`,
      zh:`格陵蘭是一個讚嘆起來容易、想像起來困難的地方。它是地球上最大的島嶼，大到足以裝下五十多個台灣，然而其中幾乎沒有一處適合人居住。八成以上的土地覆蓋在冰雪之下，聚落被擠壓在一條狹窄的海岸線上。然而整個領地的居民不到六萬人。丹麥仍掌管外交事務，但格陵蘭人自治，且主導日常生活節奏的是因紐特傳統，而非丹麥的行政體系。訪客很快就會發現，在這裡日曆和地圖同樣重要：格陵蘭其實是共用一條海岸線的兩個國家。

第一個格陵蘭在六月到來。在北極圈以北，太陽可能連續數週整天不落，凌晨兩點的地景依然閃著金光，而健行者、獨木舟愛好者與賞鯨客所遵循的作息，在其他任何地方看來都會顯得荒謬。事實上，這種無盡的明亮遠比聽起來更難以適應。習慣了正常日夜循環的旅人往往低估了它對身體的壓迫有多沉重，而睡眠變成一件必須刻意安排、而非自然發生的事。

到了遠北地區的夏末，午夜太陽逐漸讓位給真正的黑暗。夜晚變得漫長而星光燦爛，北極光以緩慢的綠色簾幕在頭頂流動，狗拉雪橇與滑雪取代了獨木舟與登山靴。然而，如此壯闊的地景並不總是溫柔的。天氣說變就變，小型飛機停飛，訪客可能發現自己受困在一個兩百人的村莊裡，等上好幾天才等到天空放晴。

不過，最終讓這座島嶼令人難忘的，卻是比任何冰河都更小的東西。在首府努克，色彩鮮豔的房屋沿著峽灣層層攀升，國家博物館以因紐特人自己的聲音訴說因紐特的故事，廚房裡端出的是當天早上捕獲的海鮮，配上麝香牛肉。這個社群緊密相繫，而它對土地的敬意深到足以形塑建築、飲食與談話的方式。格陵蘭無疑值得一生至少造訪一次——不是因為它美（雖然它確實美），而是因為它會悄悄地重新排列你對「尺度」的感受。`,

    groups:[{
      passage:`__17__ concrete keeps a modern city clean in ordinary weather, it also removes almost every surface that once drank the rain. Before the pavement arrived, roots and leaf litter worked as natural __18__, holding water and releasing it slowly; today the soil beneath the road is __19__ enough to shed rain as efficiently as a roof does. So when the sky opens, the rain does not sink; it runs, gathering speed until narrow streets carry torrents powerful enough to lift a parked car. This is the flash flood: not the patient rise of a seasonal river, but an ambush that arrives within six hours of the first drop and leaves as suddenly.

The sky has changed as well. Warmer air holds more moisture and releases it faster, so a storm that once lasted an afternoon can now empty itself in an hour. Floods appear in places that rarely flooded before, from mountain valleys to dry creek beds. Deforestation upstream and unplanned building on hillsides __20__ too, sending water toward the city long before anyone downstream has been warned. __21__ the drains are full, there is nowhere left for the volume to go. Engineers therefore argue that __22__ ever-larger pipes is a losing race, since storm intensity is increasing faster than drainage systems can be expanded.

The alternative being engineered across East Asia is softer ground: permeable pavements, rooftop gardens, and restored wetlands that hold rain where it falls. But green infrastructure only works if someone tends it, and rooftop gardens that are poorly maintained become little more than expensive roofs. Because a city rarely builds these schemes alone, both __23__ to the contract must agree from the outset which of them repairs what. Public preparedness matters just as much. Within minutes of the city __24__ a warning, families should already be moving toward higher ground, and the drills __25__ by city governments each summer repeat one rule: never drive into moving water. Knee-deep water can sweep a car away, so entering a flooded underpass is never a(n) __26__ risk; it is simply a gamble.

Urban flooding is becoming a universal problem, but a prepared city and an alert public can turn catastrophe into inconvenience.`,
      zh:`雖然混凝土讓現代城市在一般天氣下保持整潔，它同時也移除了幾乎所有曾經吸收雨水的表面。在鋪面出現之前，樹根與落葉層像天然的海綿一樣運作，把水留住再慢慢釋放；如今道路底下的土壤已經緊實到能像屋頂一樣有效地把雨水排開。因此當天空一開，雨水不再下滲，而是奔流，一路加速，直到狹窄的街道承載著足以掀起一輛停放車輛的急流。這就是暴洪：它不是季節性河川那種耐心的水位上升，而是在第一滴雨落下後六小時內就到來、又同樣突然離去的一場伏擊。

天空本身也變了。較溫暖的空氣能容納更多水氣，並且釋放得更快，因此一場過去要下一整個下午的暴雨，如今可能在一小時內就傾瀉而盡。洪水出現在以往鮮少淹水的地方，從山谷到乾涸的河床都是。上游的濫伐與山坡地的無序開發也起了作用，在下游任何人收到警告之前，就把水送往城市。一旦排水道滿了，這麼大的水量就無處可去。因此工程師主張，投資於越來越大的管線是一場注定落敗的競賽，因為暴雨強度增加的速度，比排水系統能夠擴建的速度更快。

東亞各地正在打造的替代方案是更柔軟的地面：透水鋪面、屋頂花園，以及讓雨水就地留存的復育濕地。但綠色基礎建設唯有在有人照料的前提下才有效，疏於維護的屋頂花園不過是昂貴的屋頂罷了。由於城市很少獨力興建這類設施，合約的雙方當事人必須從一開始就講清楚誰負責維修什麼。公眾的整備同樣重要。在城市發布警報後的幾分鐘內，家庭就應該已經在往高處移動，而各地市政府每年夏天舉辦的演習都在重複一條規則：絕對不要開車駛入流動的水中。及膝的水就能把一輛車沖走，所以駛入淹水的地下道從來不是一種經過計算的風險，那只是一場豪賭。

都市洪災正在成為一個普世問題，但一座有準備的城市與一群警覺的民眾，能夠把災難變成不便。`,

      passage:`In recent years, slow jogging, or super slow running, has become increasingly popular among fitness enthusiasts. This form of exercise emphasizes low-intensity and long-duration running, aiming to improve endurance and reduce the risk of injury by slowing down the running pace. This slower pace helps runners maintain a steady heart rate and reduce cardiovascular strain, which ensures comfort and relaxation throughout the run.

Slow jogging is suitable for a wide range of people, including beginners just starting to run, middle-aged and elderly individuals, and fitness enthusiasts looking to improve their endurance through low-intensity exercise. It is also a great option for those recovering from injuries or with chronic health conditions, as it places less stress on the joints and muscles. However, it is not usually recommended for athletes seeking high-intensity training or needing to quickly improve speed and strength. __28__

Slow jogging requires a gentle running technique without excessive strain. You can start with a 5- to 10-minute warm-up of brisk walking or light stretching. Maintain an upright posture and jog at a pace slightly faster than walking to ensure that you can hold a conversation comfortably. Take short strides, land softly beneath your center of gravity to minimize joint impact, and focus on deep, rhythmic breathing. Before you wrap up your exercise, cool down with slow walking and stretching. If you're new to running or aiming to reduce injury risk, try incorporating it into your routine a couple of times a week. Consistency is key to enjoying its benefits, and it's never too late to start. Remember, slow and steady wins the race!

People considering slow jogging should keep several important tips in mind. Runners should wear proper running shoes for support and cushioning, perform warm-ups and stretches to prevent injury, maintain good posture to reduce pressure on the back and knees, and stay hydrated, especially in hot weather. Avoid pushing yourself too hard, as this can lead to injury, too. With proper technique and preparation, super slow running can not only enhance physical fitness but also bring peace and joy to the mind.`,
      zh:`近年來，慢跑——或稱超慢跑——在健身愛好者之間越來越受歡迎。這種運動形式強調低強度、長時間的跑步，目的是透過放慢跑步速度來提升耐力並降低受傷風險。這種較慢的節奏有助於跑者維持穩定的心率、減輕心血管的負擔，使整段跑步過程都保持舒適與放鬆。

超慢跑適合各式各樣的人，包括剛開始跑步的初學者、中高齡族群，以及希望透過低強度運動提升耐力的健身愛好者。對於正在從傷勢中恢復、或患有慢性疾病的人來說，它也是很好的選擇，因為它對關節與肌肉造成的壓力較小。然而，對於追求高強度訓練、或需要快速提升速度與力量的運動員而言，通常並不建議採用。他們更適合從事短跑與肌力訓練。

超慢跑需要溫和的跑步技巧，避免過度用力。你可以先用五到十分鐘的快走或輕度伸展來暖身。保持上身挺直，以略快於走路的速度慢跑，確保自己還能舒服地與人交談。步幅要小，讓腳輕柔地落在重心正下方以減少關節衝擊，並專注於深沉而規律的呼吸。結束運動之前，用慢走與伸展來緩和。如果你是跑步新手，或希望降低受傷風險，可以試著每週把它安排進日常作息兩三次。持之以恆是享受其益處的關鍵，而且什麼時候開始都不嫌晚。記住，慢而穩者得勝。

    {
      passage:`Alongside world-famous festivals like Fuji Rock Festival and Lollapalooza, Coachella is one of the most influential music festivals in the world. Officially known as the Coachella Valley Music and Arts Festival, it was first held in 1999 and usually takes place each spring at the Empire Polo Club in Indio, California, nestled within the Coachella Valley in the Colorado Desert. The event takes place over two Friday-to-Sunday runs in April, drawing music lovers, artists, and trendsetters from across the globe. At full capacity, the festival can attract around 125,000 attendees per day, cementing its status as one of the largest and most profitable music events in the world.

One of Coachella's biggest highlights is its impressive lineup, featuring international superstars across a wide range of genres, including indie, hip-hop, and electronic dance music. The festival is well known for its unforgettable performances and surprise guest appearances that make headlines around the world. Multiple stages offer diverse experiences: the Main Stage hosts major headliners, while the Sahara Tent delivers electronic performances with immersive lighting and visuals. Beyond music, the festival showcases large-scale art displays, interactive exhibits, and a wide variety of food options, creating an alternative cultural space where music and art blend seamlessly.

Despite being held in a harsh desert environment, Coachella continues to transcend the idea of a typical music festival. Its influence extends far beyond the festival grounds, making it one of the most important events in global entertainment each year. It is set apart by its unique combination of music, art, and fashion. Many celebrities and influencers attend wearing free-spirited outfits, such as denim shorts, wide-brim hats, and sparkly accessories, which has helped create the iconic "Coachella style" that shapes fashion trends worldwide. In the age of social media, the festival has also become a major platform for brands and influencers, spreading its influence to audiences far beyond those who attend in person.

Attending, however, requires preparation. The desert climate can be extreme, with scorching days and considerably cooler nights, making sunscreen, hydration, and layered clothing essential. Overall, Coachella offers more than just music. It delivers a rich, one-of-a-kind cultural experience that never fails to impress.`,
      zh:`與富士搖滾音樂祭、Lollapalooza 等世界知名音樂節齊名，科切拉是全球最具影響力的音樂節之一。它的正式名稱是「科切拉山谷音樂與藝術節」，首次舉辦於一九九九年，通常在每年春天於加州印第奧的帝國馬球俱樂部舉行，該地座落於科羅拉多沙漠中的科切拉山谷。活動在四月的兩個週五至週日檔期舉行，吸引來自全球各地的樂迷、藝術家與潮流引領者。在滿場的情況下，這個音樂節每天可吸引約十二萬五千名參加者，鞏固了它作為世界上規模最大、獲利最高的音樂盛事之一的地位。

科切拉最大的亮點之一是它令人矚目的演出陣容，網羅橫跨多種曲風的國際巨星，包括獨立音樂、嘻哈與電子舞曲。這個音樂節以其令人難忘的演出，以及登上全球頭條的驚喜嘉賓演出而聞名。多個舞台提供多元的體驗：主舞台由重量級壓軸藝人擔綱，而撒哈拉帳篷則以沉浸式的燈光與視覺效果呈現電子音樂演出。除了音樂之外，音樂節還展出大型藝術裝置、互動展覽與各式各樣的餐飲選擇，打造出一個音樂與藝術無縫交融的另類文化空間。

儘管在嚴酷的沙漠環境中舉行，科切拉仍不斷超越一般音樂節的框架。它的影響力遠遠延伸到會場之外，使它成為每年全球娛樂界最重要的盛事之一。真正讓它與眾不同的，是音樂、藝術與時尚的獨特結合。許多名人與網紅穿著自由不羈的服飾出席，例如丹寧短褲、寬簷帽與亮片配件，這也促成了標誌性的「科切拉風格」，進而影響全球時尚潮流。在社群媒體的時代，這個音樂節也成為品牌與網紅的重要平台，把影響力擴散到遠遠超出親自到場者的廣大受眾。

然而，參加是需要準備的。沙漠氣候可能相當極端，白天酷熱而夜晚明顯轉涼，因此防曬、補水與洋蔥式穿搭都不可或缺。整體而言，科切拉提供的遠不只是音樂，它帶來的是一場豐富而獨一無二、從未讓人失望的文化體驗。`,
      questions:[

            B:"富士搖滾與 Lollapalooza 只在第一句被提及作為對照，文章沒有介紹任何其他音樂節的歷史。",
            C:"文中只有 most profitable 一詞碰到獲利，並未討論它對全球經濟的影響。以偏概全。",

          },
          evidence:"Overall, Coachella offers more than just music.",
          notes:[
            {term:"標題題解法", pos:"技巧", gloss:"標題必須涵蓋全文且抓住主軸。首段與末段常藏著答案——本文末段的 more than just music 幾乎就是標題本身。"},
            {term:"transcend", pos:"vt.", gloss:"超越、超脫（transcend the idea of a typical music festival 超越一般音樂節的框架）"}

            {k:"⑦", w:"extraordinary", note:"提示為 e___y。extraordinary 意為「非凡的、了不起的」，由 extra-（超出）＋ ordinary（普通）構成，記法直觀。"}
          ],
          why:"這題的難點在三個雙字片語都必須整組寫對。set forth 容易誤寫成 set forward；cope 後面的 with 常被漏掉，因為中文的「應對」聽起來像及物動詞；provided that 則容易只寫 provided 而漏掉 that。最後的 extraordinary 拼字長，注意中間是 -ordin-，別漏字母。",
          notes:[
            {term:"set forth", pos:"phr. v.", gloss:"闡明、提出（計畫、理論）；也指「動身出發」", ex:"The report sets forth three main proposals.", exZh:"這份報告提出了三項主要建議。"},
            {term:"cope with", pos:"phr. v.", gloss:"應付、處理（困難、壓力）。cope 為不及物，不可寫成 cope the pressure。", ex:"She copes well with stress.", exZh:"她很能應付壓力。"},
            {term:"provided (that)", pos:"conj.", gloss:"倘若、前提是（＝on condition that）", ex:"You may leave early, provided that the work is done.", exZh:"只要工作完成，你可以提早離開。"}
          ]},

        { n:40, kind:"中譯填空（7 格）",
          prompt:"這位科學家指出，水源已受到放射性物質污染，並針對輻射可能造成的健康風險發表聲明。對此，地方政府決定修改緊急應變計畫，並採用一套更具彈性的動態系統，以便迅速因應不斷變化的情況。",
          stem:`The scientist ①______ ②______ that the water had been ③______ with radioactive material and issued a statement ④______ the possible health risks from ⑤______. In response, the local government decided to ⑥______ its emergency plan and adopt a more ⑦______ system that could respond quickly to changing conditions.`,
          answers:[
            {k:"①", w:"pointed", note:"提示為 p___ o___。point out 意為「指出」，此處為過去式。"},
            {k:"②", w:"out", note:"point out that + 子句是固定用法。注意 out 不可省略，否則 point 變成「指向」。"},
            {k:"③", w:"contaminated", note:"提示為 c___。be contaminated with 意為「被…污染」，介系詞用 with 不是 by（by 用於指出污染的「行為者」）。"},
            {k:"④", w:"regarding", note:"提示為 r___g。regarding 為介系詞，意為「關於」（＝concerning／about），後面直接接名詞片語。"},
            {k:"⑤", w:"radiation", note:"提示為 r___n。radiation 是「輻射」，與前面的形容詞 radioactive（放射性的）同字根，題目刻意讓兩者呼應。"},
            {k:"⑥", w:"modify", note:"提示為 m___。decided to 後接原形動詞。modify 意為「修改、調整」。"},
            {k:"⑦", w:"dynamic", note:"提示為 d___。a more dynamic system「更具彈性的動態系統」，呼應後面的 respond quickly to changing conditions。"}
          ],
          why:"這題有兩組相互呼應的字要留意。第一組是 radioactive 與 radiation——題目在空格前先給了形容詞形，空格要填名詞形，是刻意的提示。第二組是 contaminated with 的介系詞：中文的「受到污染」容易讓人直覺寫 by，但 with 才是搭配「污染物」的正確用法。另外 regarding 是介系詞不是動詞，後面不接子句，這點也常被搞混。",
          notes:[
            {term:"point out (that)", pos:"phr. v.", gloss:"指出、提出（某項事實）", ex:"She pointed out that the data was outdated.", exZh:"她指出那些資料已經過時了。"},
            {term:"be contaminated with", pos:"phr.", gloss:"被…污染（後接污染物）。n. contamination", ex:"The soil was contaminated with lead.", exZh:"土壤受到鉛污染。"},
            {term:"regarding", pos:"prep.", gloss:"關於（＝concerning／with regard to）；為介系詞，後接名詞，不接子句。", ex:"I have a question regarding the schedule.", exZh:"我對時程安排有個疑問。"},
            {term:"dynamic", pos:"adj.", gloss:"動態的、有活力的（反義 static 靜態的）"}
          ]}
      ]
    }]
  }
  ]
};

/* ==========================================================================
   ②  以下為程式碼，一般情況不需要修改。
   ========================================================================== */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const wordOf = q => q.options ? q.options[q.answer] : (q.answerText || '');
const allQ = [];
EXAM.sections.forEach(s => s.groups.forEach(g => g.questions.forEach(q => allQ.push(q))));
const findQ = n => allQ.find(q => String(q.n) === String(n));

document.getElementById('brand').textContent = EXAM.brand;
document.getElementById('examTitle').textContent = EXAM.title;
document.getElementById('examMeta').textContent = EXAM.meta;

let noteCount = 0;
allQ.forEach(q => noteCount += (q.notes || []).length);

const nav = document.getElementById('nav');
EXAM.sections.forEach(s => {
  const a = document.createElement('a');
  a.className = 'chip'; a.href = '#sec-' + s.id; a.textContent = s.label.replace(/^[一二三四五六]、/, m => m);
  nav.appendChild(a);
});
const noteChip = document.createElement('a');
noteChip.className = 'chip'; noteChip.href = '#side'; noteChip.textContent = '重點表 ' + noteCount;
nav.appendChild(noteChip);
const toggleAll = document.createElement('button');
toggleAll.className = 'chip solid'; toggleAll.textContent = '全部展開';
nav.appendChild(toggleAll);

function renderPassage(g, i, sid) {
  let html = esc(g.passage);
  g.questions.forEach(q => {
    if (!q.evidence) return;
    const t = esc(q.evidence);
    if (html.includes(t)) html = html.replace(t, `<span class="hl ev" data-ev="${q.n}">${t}</span>`);
  });
  html = html.replace(/__(\d+)__/g, (m, n) =>
    `<button class="blank" data-blank="${n}" aria-label="第 ${n} 題空格">${n}</button>`);
  const body = '<div class="passage">' +
    html.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, ' ') + '</p>').join('') + '</div>';
  if (!g.zh) return body;
  const id = sid + '-' + i;
  return body +
    `<button class="zhbtn" data-zh="${id}">全文中譯</button>` +
    `<div class="zhbox" id="zh-${id}">` +
      g.zh.split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g, ' ') + '</p>').join('') +
    '</div>';
}

function renderQ(q) {
  const parts = [];
  if (q.options) {
    const ks = Object.keys(q.options);
    parts.push('<div class="opts">' + ks.map(k =>
      `<div class="opt"><span class="opt-k">(${k})</span><span>${esc(q.options[k])}</span></div>`).join('') + '</div>');
  }
  const head = `<div class="q-tag"><span class="q-n">${String(q.n).padStart(2,'0')}</span><span class="q-kind">${esc(q.kind || '')}</span></div>` +
    (q.prompt ? `<p class="prompt">${esc(q.prompt)}</p>` : '') +
    (q.stem ? `<p class="stem">${esc(q.stem).replace(/\n/g,'<br>')}</p>` : '');

  let ans = '';
  if (q.answers) {
    ans = '<ul class="fills">' + q.answers.map(a =>
      `<li class="fill"><span class="fill-k">${esc(a.k)}</span><span class="fill-w hl" data-ansmulti>${esc(a.w)}</span><span class="fill-n">${esc(a.note || '')}</span></li>`).join('') + '</ul>';
  } else {
    const label = q.options ? `(${q.answer}) ${esc(wordOf(q))}` :
      (q.answer ? `(${q.answer}) ${esc(q.answerText)}` : esc(q.answerText));
    ans = `<p class="ans"><span class="ans-k">答案</span><span class="ans-v hl" data-ans="${q.n}">${label}</span></p>`;
  }

  let expl = '';
  if (q.explain) {
    expl = '<ul class="lines">' + Object.keys(q.options).map(k => {
      const right = q.multi ? q.multi.includes(k) : k === q.answer;
      return `<li class="line ${right ? 'right' : 'wrong'}"><span class="line-k">(${k})</span><span>${esc(q.explain[k] || '')}</span></li>`;
    }).join('') + '</ul>';
  }
  const why = q.why ? `<p class="why">${esc(q.why)}</p>` : '';
  const sample = q.sample ? `<div class="sample"><p class="note-h">參考範文</p>` +
    q.sample.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g,' ')}</p>`).join('') + '</div>' : '';
  const evid = q.evidence ? `<p class="evid"><span>文中依據</span>${esc(q.evidence)}</p>` : '';
  const notes = (q.notes || []).length ? `<div class="note"><p class="note-h">重點整理</p>` +
    q.notes.map(nt => `<p class="note-i"><span class="term">${esc(nt.term)}</span><span class="pos">${esc(nt.pos || '')}</span><span class="gloss">${esc(nt.gloss || '')}</span>` +
      (nt.ex ? `<span class="ex">${esc(nt.ex)}<i>${esc(nt.exZh || '')}</i></span>` : '') + '</p>').join('') + '</div>' : '';

  return `<article class="q" id="q-${q.n}" data-n="${q.n}">
    <div class="q-top">${head}${parts.join('')}
      <button class="reveal" aria-expanded="false" aria-controls="body-${q.n}">看詳解</button>
    </div>
    <div class="body" id="body-${q.n}">
      ${ans}${q.translation ? `<p class="zh">${esc(q.translation)}</p>` : ''}${expl}${why}${evid}${sample}${notes}
    </div>
  </article>`;
}

document.getElementById('main').innerHTML = EXAM.sections.map((s, i) => `
  <section class="sec" id="sec-${s.id}">
    <div class="sec-head">
      <span class="sec-num">${String(i+1).padStart(2,'0')}</span>
      <h2 class="sec-label">${esc(s.label)}</h2>
      <span class="sec-score">${esc(s.score || '')}</span>
    </div>
    ${s.instruction ? `<p class="sec-inst">${esc(s.instruction)}</p>` : ''}
    ${s.bank ? `<div class="bank${s.bankWide ? ' wide' : ''}">${Object.keys(s.bank).map(k =>
      `<div class="bank-i" data-bank="${k}"><span>(${k})</span>${esc(s.bank[k])}</div>`).join('')}</div>` : ''}
    ${s.groups.map((g, gi) => (g.passage ? renderPassage(g, gi, s.id) : '') + g.questions.map(renderQ).join('')).join('')}
  </section>`).join('');

const items = [];
allQ.forEach(q => (q.notes || []).forEach(nt => items.push({ ...nt, n: q.n })));
document.getElementById('side').innerHTML = `
  <p class="side-h">Notes</p>
  <p class="side-t">本卷重點 ${items.length} 則</p>
  <ul class="card-list">${items.map(nt => `
    <li class="card-item"><a href="#q-${nt.n}">
      <span class="jump">第 ${nt.n} 題</span>
      <span class="term">${esc(nt.term)}</span><span class="pos">${esc(nt.pos || '')}</span>
      <div class="gloss">${esc(nt.gloss || '')}</div>
    </a></li>`).join('')}</ul>
  <p class="side-note">點任一則可跳到出處題目。用瀏覽器列印（Ctrl／⌘ + P）會自動展開全部詳解與中譯，可直接印成講義。</p>`;

document.getElementById('foot').textContent = `共 ${allQ.length} 題 · ${EXAM.footer}`;

function setOpen(card, open) {
  card.classList.toggle('open', open);
  const btn = card.querySelector('.reveal');
  btn.setAttribute('aria-expanded', open);
  btn.firstChild.nodeValue = open ? '收合詳解' : '看詳解';
  const n = card.dataset.n;
  card.querySelectorAll('.hl').forEach(h => h.classList.toggle('on', open));
  const ev = document.querySelector(`[data-ev="${n}"]`);
  if (ev) ev.classList.toggle('on', open);
  const q = findQ(n);
  if (q && q.answer && q.answerText) {
    const bi = document.querySelector(`[data-bank="${q.answer}"]`);
    if (bi) bi.classList.toggle('used', open);
  }
  const bl = document.querySelector(`[data-blank="${n}"]`);
  if (bl) {
    if (open) {
      bl.classList.add('filled');
      bl.innerHTML = `<sup>${n}</sup><span class="hl">${esc(wordOf(q))}</span>`;
      requestAnimationFrame(() => bl.querySelector('.hl').classList.add('on'));
    } else {
      bl.classList.remove('filled');
      bl.textContent = n;
    }
  }
}
document.addEventListener('click', e => {
  const rv = e.target.closest('.reveal');
  if (rv) { const c = rv.closest('.q'); setOpen(c, !c.classList.contains('open')); return; }
  const zb = e.target.closest('.zhbtn');
  if (zb) { zb.classList.toggle('on'); document.getElementById('zh-' + zb.dataset.zh).classList.toggle('on'); return; }
  const bl = e.target.closest('.blank');
  if (bl) {
    const c = document.getElementById('q-' + bl.dataset.blank);
    if (!c.classList.contains('open')) setOpen(c, true);
    c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
});
toggleAll.addEventListener('click', () => {
  const open = toggleAll.textContent === '全部展開';
  document.querySelectorAll('.q').forEach(c => setOpen(c, open));
  toggleAll.textContent = open ? '全部收合' : '全部展開';
});
window.addEventListener('beforeprint', () => {
  document.querySelectorAll('.q').forEach(c => setOpen(c, true));
  document.querySelectorAll('.zhbox').forEach(b => b.classList.add('on'));
  toggleAll.textContent = '全部收合';
});
</script>
</body>
</html>
