<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ED Sep. Week 1+2 詳解</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E7EBEE; --card:#FDFDFC;
  --ink:#10202F; --ink-2:#56687A; --ink-3:#7C8B99;
  --rule:#C6D0D8; --pen:#17457E; --hl:#FFE773; --miss:#A34234;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
  --read:'Literata',Georgia,'Times New Roman',serif;
  --han:'PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;
  --maxw:1180px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--han);font-size:16px;line-height:1.75}
:focus-visible{outline:2px solid var(--pen);outline-offset:3px;border-radius:2px}

.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:var(--maxw);margin:0 auto;padding:14px 24px 0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.title{font-size:23px;font-weight:600;margin:0;line-height:1.3}
.meta{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin:4px 0 0;letter-spacing:.04em}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:12px 0 11px;margin-top:10px;border-top:1px solid var(--rule)}
.chip{font-family:var(--mono);font-size:12px;letter-spacing:.04em;border:1px solid var(--rule);background:transparent;color:var(--ink-2);padding:5px 10px;border-radius:999px;cursor:pointer;text-decoration:none;transition:border-color .15s,color .15s,background .15s}
.chip:hover{border-color:var(--pen);color:var(--pen)}
.chip.solid{margin-left:auto;border-color:var(--ink);color:var(--ink);font-weight:500}
.chip.solid:hover{background:var(--ink);color:var(--card)}

.wrap{max-width:var(--maxw);margin:0 auto;padding:28px 24px 96px;display:grid;gap:36px;grid-template-columns:minmax(0,1fr) 288px}
@media (max-width:1020px){.wrap{grid-template-columns:minmax(0,1fr);gap:44px}}

.sec{margin:0 0 48px;scroll-margin-top:136px}
.sec-head{display:flex;align-items:baseline;gap:12px;padding-bottom:9px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.sec-num{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--ink-3)}
.sec-label{font-size:18px;font-weight:600;margin:0}
.sec-score{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-left:auto}
.sec-inst{font-size:13.5px;color:var(--ink-2);margin:9px 0 0}

.bank{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin:16px 0 0}
@media (max-width:760px){.bank{grid-template-columns:repeat(2,1fr)}}
.bank-i{background:var(--card);padding:8px 10px;font-family:var(--read);font-size:14.5px}
.bank-i span{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-right:5px}
.bank-i.used{background:#F2F5F6;color:var(--ink-3)}

.passage{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--ink);padding:22px 26px;margin:18px 0 0;font-family:var(--read);font-size:16.5px;line-height:1.95;color:#1a2836}
.passage p{margin:0 0 1em}
.passage p:last-child{margin-bottom:0}
.blank{display:inline-block;min-width:70px;text-align:center;border:0;border-bottom:1.5px solid var(--ink);font-family:var(--mono);font-size:13px;color:var(--pen);cursor:pointer;background:none;padding:0 4px;line-height:1.4}
.blank:hover{background:rgba(23,69,126,.07)}
.blank.filled{font-family:var(--read);font-size:16.5px;color:var(--ink);border-bottom-color:transparent;min-width:0}
.blank sup{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-right:2px}
.zhbtn{display:block;margin:0 0 18px;background:var(--card);border:1px solid var(--rule);border-top:0;width:100%;text-align:left;padding:8px 26px;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--pen);cursor:pointer}
.zhbtn:hover{color:var(--ink)}
.zhbtn::after{content:' ▾'}
.zhbtn.on::after{content:' ▴'}
.zhbox{display:none;background:#F7F9FA;border:1px solid var(--rule);border-top:0;padding:18px 26px;margin:0 0 18px;font-size:15px;line-height:1.95;color:#22323F}
.zhbox.on{display:block}
.zhbox p{margin:0 0 .9em}
.zhbox p:last-child{margin:0}

.q{background:var(--card);border:1px solid var(--rule);margin:14px 0 0;scroll-margin-top:142px}
.q-top{padding:16px 22px 14px}
.q-tag{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.q-n{font-family:var(--mono);font-size:13px;font-weight:600}
.q-kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.prompt{font-size:14.5px;line-height:1.85;color:var(--ink-2);margin:0 0 11px;padding-left:11px;border-left:2px solid var(--rule)}
.stem{font-family:var(--read);font-size:16.5px;line-height:1.85;margin:0 0 13px;color:#1a2836}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:9px;font-family:var(--read);font-size:15.5px;line-height:1.6;padding:3px 0;color:#243342}
.opt-k{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);padding-top:2px;flex:none}
.reveal{display:block;width:100%;text-align:left;margin-top:14px;background:none;border:0;border-top:1px dashed var(--rule);padding:11px 0 0;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--pen);cursor:pointer}
.reveal:hover{color:var(--ink)}
.reveal::after{content:' ▾'}
.q.open .reveal::after{content:' ▴'}
.q.open .reveal{color:var(--ink-3)}

.body{display:none;border-top:1px solid var(--rule);background:#F7F9FA;padding:18px 22px 20px}
.q.open .body{display:block}
.ans{display:flex;align-items:baseline;gap:10px;margin:0 0 13px;flex-wrap:wrap}
.ans-k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink-3);flex:none;padding-top:2px}
.ans-v{font-family:var(--read);font-size:18px;font-weight:600}
.fills{list-style:none;margin:0 0 13px;padding:0}
.fill{display:flex;gap:11px;align-items:baseline;padding:7px 0;border-bottom:1px dotted var(--rule)}
.fill-k{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:none;width:26px}
.fill-w{font-family:var(--read);font-size:17px;font-weight:600;flex:none}
.fill-n{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.zh{font-size:15px;line-height:1.85;margin:0 0 14px;color:#22323F}
.why{font-size:14.5px;line-height:1.85;margin:0 0 4px;color:#22323F;border-top:1px solid var(--rule);padding-top:12px}
.lines{margin:0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.line{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14.5px;line-height:1.75;color:var(--ink-2)}
.line-k{font-family:var(--mono);font-size:12.5px;flex:none;width:28px;color:var(--ink-3);padding-top:2px}
.line.right{color:var(--ink)}
.line.right .line-k{color:var(--ink);font-weight:600}
.line.right .line-k::after{content:'✓';display:block;font-size:12px;line-height:1.3}
.line.wrong .line-k{color:var(--miss);opacity:.85}
.line.wrong .line-k::after{content:'✗';display:block;font-size:12px;line-height:1.3}
.evid{margin:15px 0 0;font-family:var(--read);font-size:14.5px;line-height:1.8;color:var(--ink-2);padding-left:13px;border-left:2px solid var(--hl)}
.evid span{font-family:var(--han);font-size:11px;letter-spacing:.14em;color:var(--ink-3);display:block;margin-bottom:3px}

.hl{background-image:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 90%,transparent 90%);background-repeat:no-repeat;background-size:0% 100%;transition:background-size .55s cubic-bezier(.2,.75,.3,1);border-radius:1px}
.hl.on{background-size:100% 100%}

.sample{margin:15px 0 0;border:1px solid var(--rule);border-left:3px solid var(--ink);background:var(--card);padding:16px 20px}
.sample p:not(.note-h){font-family:var(--read);font-size:15.5px;line-height:1.9;color:#1a2836;margin:0 0 1em}
.sample p:last-child{margin-bottom:0}
.bank.wide{grid-template-columns:1fr}
.bank.wide .bank-i{font-size:15px;line-height:1.7;padding:10px 14px}
.note{margin:15px 0 0;border:1px solid var(--rule);background:var(--card);padding:13px 16px}
.note-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.note-i{margin:0;padding:9px 0 0;border-top:1px dotted var(--rule)}
.note-i:first-of-type{border-top:0;padding-top:0}
.term{font-family:var(--read);font-size:16px;font-weight:600}
.pos{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin:0 6px}
.gloss{font-size:14.5px}
.ex{font-family:var(--read);font-size:14px;color:var(--ink-2);line-height:1.7;margin:3px 0 0;display:block}
.ex i{font-family:var(--han);font-style:normal;font-size:13px;color:var(--ink-3);display:block}

.side{position:sticky;top:136px;align-self:start;max-height:calc(100vh - 164px);overflow:auto;padding-right:4px}
@media (max-width:1020px){.side{position:static;max-height:none;scroll-margin-top:136px}}
.side-h{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin:0 0 3px}
.side-t{font-size:16px;font-weight:600;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.card-list{margin:0;padding:0;list-style:none}
.card-item{border-bottom:1px solid var(--rule);padding:11px 0}
.card-item a{display:block;text-decoration:none;color:inherit}
.card-item a:hover .term{background:var(--hl)}
.jump{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);float:right;padding-top:5px}
.side-note{font-size:12.5px;color:var(--ink-3);line-height:1.7;margin:16px 0 0}
.foot{max-width:var(--maxw);margin:0 auto;padding:0 24px 48px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  body{background:#fff;font-size:10.5pt}
  .top,.side,.reveal,.foot,.zhbtn{display:none!important}
  .wrap{display:block;max-width:none;padding:0}
  .q .body{display:block!important}
  .zhbox{display:block!important}
  .q{break-inside:avoid;border-color:#999;margin-bottom:9pt}
  .passage{break-inside:avoid}
  .hl{background-size:100% 100%!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <p class="eyebrow" id="brand"></p>
    <h1 class="title" id="examTitle"></h1>
    <p class="meta" id="examMeta"></p>
    <nav class="bar" id="nav"></nav>
  </div>
</header>

<div class="wrap"><main id="main"></main><aside class="side" id="side"></aside></div>
<p class="foot" id="foot"></p>

<script>
/* ==========================================================================
   ①  題目與詳解全部寫在下面的 EXAM 物件裡。要改題、加題、修字，只動這裡。

   section（大題）：{ id, label, score, instruction, bank?, groups: [...] }
   group（同一篇文章的題組）：{ passage?, zh?, questions: [...] }
       passage 裡寫 __7__ 就會變成可點的空格，數字對應題號。
       zh 是全文中譯，會做成可展開的按鈕。

   question 依題型三選一：
     選擇題   { n, kind, stem, options:{A..D}, answer:"B", translation, explain:{A..D}, evidence?, notes? }
     單一填答 { n, kind, stem, answerText:"prejudice", why, notes? }
     多格填答 { n, kind, prompt, stem, answers:[{k:"①", w:"字", note:"說明"}], notes? }
   ========================================================================== */
const EXAM = {
  brand: "English Digest Weekly Quiz",
  title: "Reading Test 詳解｜Week 1+2: Units 1–7 (Sep)",
  meta: "Instructor: Howard Chang　·　範圍：ED 雜誌 Sep. Week 1+2",
  footer: "班級複習用",
  sections: [
  /* ===================== 第一部分：聽力（僅列答案） ===================== */
  {
    id:"listening", label:"第一部分：聽力測驗", score:"28%",
    instruction:"本部分僅列答案，不附詳解。　一、看圖辨義 1. (A)　2. (A)(C)　｜　二、對答 3–6：B A C D　｜　三、簡短對話 7–10：A C B D　｜　四、短文聽解 11–12：C A",
    groups:[{ questions:[] }]
  },

  /* ===================== 一、詞彙 ===================== */
  {
    id:"vocab", label:"二之一、詞彙", score:"15% · 每題 3%",
    instruction:"依句意及提示字母填入正確單字，注意詞性與拼字。",
    groups:[{
      questions:[
        { n:13, kind:"提示：co___e",
          stem:"A good summary should be co______e, capturing the main points in a few sentences without copying every detail from the original text.",
          answerText:"concise",
          translation:"一份好的摘要應該精簡扼要，用幾句話抓住重點，而不是把原文的每個細節都抄過來。",
          why:"空格前是 be 動詞，需要形容詞。決定性線索在後面的分詞片語：capturing the main points in a few sentences（用幾句話抓住重點）與 without copying every detail（不抄錄每個細節）——兩者都在描述「話少但講到位」，這正是 concise 的定義。注意它不只是「短」，而是「精簡而不失重點」；只是短而漏掉重點叫 incomplete，不叫 concise。",
          notes:[
            {term:"concise", pos:"adj.", gloss:"簡潔扼要的（n. concision／conciseness）", ex:"Keep your answer clear and concise.", exZh:"回答請保持清楚扼要。"},
            {term:"concise vs. brief", pos:"辨析", gloss:"brief 只強調「短」；concise 強調「短而且完整達意」。學術寫作講究的是後者。"}
          ]},

        { n:14, kind:"提示：vi___d",
          stem:"The documentary included vi______d images of coral reefs, which helped viewers understand both their beauty and their environmental importance.",
          answerText:"vivid",
          translation:"這部紀錄片收錄了珊瑚礁鮮明生動的影像，幫助觀眾同時理解它們的美麗與環境上的重要性。",
          why:"空格修飾名詞 images，需要形容詞。關係子句說這些影像 helped viewers understand ... their beauty（幫助觀眾理解珊瑚礁之美）——能傳達美感的影像必然是色彩鮮明、栩栩如生的。vivid 除了形容色彩鮮豔，也可形容記憶、描述、想像力的生動。",
          notes:[
            {term:"vivid", pos:"adj.", gloss:"鮮明的、生動的（a vivid memory 鮮明的記憶／a vivid imagination 豐富的想像力）", ex:"She gave a vivid account of the accident.", exZh:"她對那場意外做了生動的描述。"},
            {term:"coral reef", pos:"n.", gloss:"珊瑚礁"}
          ]},

        { n:15, kind:"提示：cr___y",
          stem:"The newspaper lost much of its cr______y after readers discovered that several of its reports contained inaccurate information and unsupported claims.",
          answerText:"credibility",
          translation:"在讀者發現該報數篇報導含有不正確的資訊與缺乏根據的主張之後，這家報社失去了大部分的公信力。",
          why:"空格前有所有格 its、前面的動詞是 lost，需要名詞。after 子句列出兩項罪狀：inaccurate information（不正確的資訊）與 unsupported claims（無根據的主張）——會因此失去的東西就是「可信度」。credibility 由形容詞 credible（可信的）加名詞字尾而來，字根 cred- 表「相信」（同源字：credit、incredible）。",
          notes:[
            {term:"credibility", pos:"n.", gloss:"可信度、公信力（adj. credible 可信的／credulous 輕信的）", ex:"The scandal damaged his credibility as a leader.", exZh:"這樁醜聞損害了他身為領導者的公信力。"},
            {term:"字根 cred-", pos:"字根", gloss:"表「相信」：credit（信用）、incredible（難以置信的）、credential（資格證明）。"}
          ]},

        { n:16, kind:"提示：p___ze",
          stem:"During exam week, students should p______ze the subjects they find most difficult instead of spending equal time on everything.",
          answerText:"prioritize",
          translation:"在考試週，學生應該優先處理自己覺得最困難的科目，而不是把時間平均分配在所有事情上。",
          why:"should 後面要接原形動詞，且空格後直接接受詞 the subjects，需要及物動詞。instead of spending equal time on everything（而不是把時間平均分配）是關鍵對比——不平均分配，就是要「排優先順序」。prioritize 由名詞 priority（優先）加動詞字尾 -ize 而成。注意提示的字尾是 -ze，直接指向這個字尾。",
          notes:[
            {term:"prioritize", pos:"vt.", gloss:"優先處理、排定優先順序（n. priority）", ex:"You need to prioritize your tasks.", exZh:"你需要為你的工作排優先順序。"},
            {term:"give priority to", pos:"phr.", gloss:"優先考慮…（＝prioritize 的名詞說法）"}
          ]},

        { n:17, kind:"提示：su___y",
          stem:"Without a government su______y, many low-income families would be unable to afford the rising cost of housing in major cities.",
          answerText:"subsidy",
          translation:"若沒有政府補助，許多低收入家庭將無力負擔大城市中不斷上漲的住房成本。",
          why:"空格前有冠詞 a 與形容詞 government，需要單數名詞。句子是與現在事實相反的假設（Without ... would be unable to afford），意思是「現在有這東西，所以他們負擔得起」——政府提供、能讓人負擔得起住房的，就是補助金。subsidy 為可數名詞，動詞形為 subsidize。",
          notes:[
            {term:"subsidy", pos:"n.", gloss:"補助金、津貼（可數；v. subsidize 補助）", ex:"Farmers receive subsidies for growing certain crops.", exZh:"農民種植特定作物可獲得補助。"},
            {term:"Without + N, S would + V", pos:"假設語氣", gloss:"＝If it were not for...，表與現在事實相反。看到 would 就知道這是假設而非直述。"}
          ]}
      ]
    }]
  },

  /* ===================== 二、綜合測驗 ===================== */
  {
    id:"cloze", label:"二之二、綜合測驗", score:"24% · 每題 2%",
    instruction:"兩篇短文，共 12 題。點文章裡的空格可直接跳到該題。答案：BCCADD　DCABDB",
    groups:[
    {
      passage:`Numbers are not the only things hiding inside English idioms. Animals turn up there far more often than most learners realize, and these animal idioms are a familiar source of __18__. A person who "lets the cat out of the bag" has revealed a secret, while a plan that "goes to the dogs" is falling apart. Neither the cat nor the dog has anything to do with what the speaker means, so anyone who tries to __19__ an idiom by adding up its individual words will only end up confused. Some teachers therefore advise students to skip idioms altogether and to stick to plain, literal wording in their own speech. __20__, no learner can avoid meeting them. Familiarity with them sharpens both comprehension and the ability to express oneself with precision.

These phrases grew out of centuries of farm and forest life, and many are laced with humor. They are now so __21__ in casual chat, news reports, and academic discourse that most speakers no longer hear the animal at all. "A wolf in sheep's clothing" goes back to a fable in which a predator disguises itself to hunt unnoticed, and it now describes anyone whose warmth hides bad intentions. From this angle, an idiom is __22__ a puzzle to be solved as a story to be remembered. The story also shows a learner when a phrase actually fits: calling someone a wolf in sheep's clothing is an accusation, so a speaker who wants to __23__ a harsh judgment will reach for gentler wording instead. Such phrases are a reminder that English extends well beyond grammar rules and word lists.`,
      zh:`數字並不是唯一藏在英文慣用語裡的東西。動物出現在其中的頻率遠比大多數學習者所以為的高，而這些動物慣用語是學習者熟悉的挫折來源。說某人「let the cat out of the bag」是指他洩漏了祕密，而一項「goes to the dogs」的計畫則是正在瓦解。貓和狗都與說話者的本意毫無關係，因此任何試圖把單字一個個加起來去理解慣用語的人，最後只會一頭霧水。因此有些老師建議學生乾脆跳過慣用語，在自己說話時堅持使用平實、字面的措辭。儘管如此，沒有一個學習者能避免遇到它們。熟悉這些慣用語，能同時增進理解力與精準表達自己的能力。

這些片語生長自數百年的農耕與林野生活，許多還帶著幽默。它們如今在閒聊、新聞報導與學術論述中都已如此司空見慣，以致於大多數說話者根本不再聽見那隻動物。「A wolf in sheep's clothing」（披著羊皮的狼）源自一則寓言，其中一隻掠食者偽裝自己以便不被察覺地獵食；如今它用來形容任何以溫暖掩飾惡意的人。從這個角度看，與其說慣用語是一道待解的謎題，不如說是一個值得記住的故事。這個故事也告訴學習者一個片語何時真正適用：說某人是披著羊皮的狼是一種指控，因此想要緩和嚴厲評斷的人，會轉而選擇比較溫和的措辭。這類片語提醒我們，英文遠遠不只是文法規則與單字表。`,

    {
      passage:`Romania is not the only country where the dead are sent off in color. Among the Ga people of southern Ghana, there is a strong __24__ to treat a funeral as a celebration rather than an occasion for grief. Some coffins are shaped like animals, others like the tools of a trade, and still others like the machines their owners once drove. Visitors often assume that such bright shapes make light of death. __25__, the more elaborate the coffin, the more respect it shows. Mourners arrive in printed cloth, brass bands play through the streets, and the procession can fill an entire afternoon. The whole scene is __26__ the hushed ceremonies most Europeans grow up with.

These coffins take shape in small family workshops, where the craft passes from one generation to the next. Every joint and every brushstroke will be inspected by hundreds of mourners, so a finished piece has to be __27__. Since neighbors read a coffin the way visitors to Sapanta, in northern Romania, read an epitaph, a design that missed the deceased person's character would __28__ the family's standing for years. Wealthy families may wait several months and pay more than a year's wages before the workshop hands over the finished box. __29__ one craftsman named Kane Kwei, who built a boat-shaped coffin for a fisherman in the 1950s, the tradition might never have existed at all. Like the painted crosses of Sapanta, these coffins insist that a life well lived deserves not only tears but also laughter.`,
      zh:`羅馬尼亞並不是唯一一個以色彩送別逝者的國家。在迦納南部的加族人之中，有一種強烈的傾向，把葬禮當成慶典而非哀傷的場合。有些棺木做成動物的形狀，有些做成某項行業的工具，還有些做成主人生前駕駛的機器。訪客常以為這樣鮮豔的造型是在拿死亡開玩笑。恰恰相反，棺木越是精緻，所展現的敬意就越深。弔唁者身穿印花布前來，銅管樂隊沿街演奏，送葬隊伍可以佔滿一整個下午。整個場面與大多數歐洲人從小習慣的肅穆儀式相去甚遠。

這些棺木成形於小型的家庭工坊，手藝在世代之間傳承。每一處接榫、每一筆刷痕都會被數百名弔唁者檢視，因此一件完成品必須毫無瑕疵。由於鄰里閱讀一具棺木的方式，就像造訪羅馬尼亞北部薩本查的訪客閱讀墓誌銘一樣，一個沒能抓住逝者性格的設計，會在往後數年損害這個家族的聲望。富裕的家庭可能要等上好幾個月、付出超過一年工資的代價，工坊才會交出完成的木箱。要不是因為一位名叫凱恩・奎伊的工匠——他在一九五○年代為一位漁夫打造了一具船形棺木——這項傳統可能根本不會存在。就像薩本查那些彩繪的十字架一樣，這些棺木堅持著一件事：一個活得精彩的生命，值得的不只是眼淚，還有笑聲。`,

      passage:`Our brains were built to notice danger first, and newsrooms worked this out long before researchers gave the habit a name. Readers get twice as far down a(n) __30__ about a failure as they do down one about a success, so editors put the bad news up front. The __31__ chosen for a story follow the same rule: a burning building holds the eye, while a repaired one does not. What __32__ most of us to open an article is not curiosity but a small warning bell. It is far more profitable to report what has gone wrong than to record what is quietly going right.

Online ratings run on the same ancient alarm. A hundred warm lines can feel __33__ next to one furious sentence typed at midnight, no matter how carefully those hundred were written. Shoppers who __34__ this pattern still fall for it, since a complaint reads like evidence while approval reads like noise. Over time it is easy to grow __35__ about ratings altogether and to trust nothing the crowd says.

Neither swallowing the complaints nor dismissing the whole system is much help. A wiser move is to open the three-star reviews, where the __36__ is usually fairest, and to remember that one bad evening does not define a restaurant's whole __37__. There is something __38__ about the whole business: the alarm that once kept people alive now makes us worse judges of the world around us. The goal is not to pretend that bad news is rare, but to give the good news the attention it deserves. Speaking __39__, that alarm is a smoke detector, and it still goes off when the toast burns.`,
      zh:`我們的大腦生來就先注意到危險，而新聞編輯室早在研究者為這個習性命名之前，就已經想通了這一點。讀者讀一篇關於失敗的文章，能讀到的長度是讀一篇關於成功的文章的兩倍，所以編輯把壞消息放在最前面。為一則報導挑選的視覺素材也遵循同樣的規則：一棟燃燒中的建築抓得住目光，一棟修好的則不會。促使我們大多數人點開一篇文章的，不是好奇心，而是一記小小的警鈴。報導出了什麼差錯，遠比記錄什麼正安靜地順利進行來得有利可圖。

線上評分也運作在同一套古老的警報系統上。一百行溫暖的留言，擺在半夜打出的一句怒言旁邊，可能顯得微不足道，無論那一百行寫得多麼用心。就算是看穿了這個模式的購物者，仍然會落入其中，因為一則抱怨讀起來像證據，而讚美讀起來像雜訊。久而久之，人很容易對評分整體變得憤世嫉俗，什麼都不相信群眾說的話。

無論是照單全收那些抱怨，還是全盤否定整個系統，都幫助不大。比較明智的作法，是去打開三星評論——那裡的意見通常最公允——並且記得，一個糟糕的夜晚並不能定義一家餐廳的全部特質。這整件事有某種諷刺之處：那個曾經讓人活下來的警報，如今卻讓我們對周遭世界的判斷變得更差。目標不是假裝壞消息很罕見，而是給好消息應得的注意力。打個比方，那個警報是一個煙霧偵測器，而它在吐司烤焦時仍然會響。`,

    groups:[{
      passage:`As populations age, many countries are facing the challenge of ensuring road safety while respecting older adults' independence. Advances in healthcare have allowed people to live longer and remain active well into old age, which means that more senior citizens continue to drive. However, concerns arise when age-related changes affect a person's ability to drive safely. Several high-profile traffic incidents, widely covered by the media, have prompted governments to review their policies regarding elderly drivers. As a result, countries around the world have developed different approaches to managing this issue, each reflecting its own social values and transportation needs.

Some countries have adopted stricter regulations for older drivers. In Taiwan and Japan, for example, elderly drivers are required to undergo mandatory renewal of their licenses from a certain age—in Taiwan from age 70, and in Japan from age 75. During the renewal process, they may need to complete health examinations and attend safety courses. They may also take tests that evaluate their ability to think, remember, and process information. Singapore has also introduced measures that require older drivers aged 65 and above to meet certain medical standards before renewing their licenses. Supporters of these policies argue that they help identify individuals whose driving abilities have declined due to aging and thereby reduce potential risks on the road.

Other countries prefer a more flexible, self-regulated system. In the US, regulations vary by state, with some requiring vision tests or more frequent renewals for senior drivers. Australia follows a similar state-by-state approach, with requirements ranging from annual medical assessments in some states to no age-based requirements at all in others, such as Victoria and Tasmania. Rather than imposing uniform age-based rules, these countries generally believe that driving ability should be evaluated individually based on each person's health and functional condition.

Public opinion often changes after authorities announce details of a fatal accident involving an elderly driver. Such events may lead to calls for stricter regulations, but many experts believe that limiting elderly drivers is only part of the solution. They argue that governments should also improve public transportation, community shuttle services, and other alternatives so that older adults can remain independent without relying entirely on cars. Ultimately, the goal is to create a system that protects public safety while preserving the mobility and dignity of an aging population.`,
      zh:`隨著人口老化，許多國家正面臨一項挑戰：既要確保道路安全，又要尊重高齡者的獨立自主。醫療的進步讓人活得更久，並在步入老年後仍保持活躍，這意味著更多長者持續開車上路。然而，當與年齡相關的變化影響到一個人安全駕駛的能力時，疑慮便隨之而生。數起受媒體廣泛報導、備受矚目的交通事故，促使各國政府重新檢視關於高齡駕駛的政策。因此，世界各地發展出不同的因應方式，各自反映了自身的社會價值與運輸需求。

有些國家對高齡駕駛採取了較嚴格的規範。以台灣和日本為例，高齡駕駛人從某個年齡起必須強制換發駕照——台灣是七十歲，日本是七十五歲。在換照過程中，他們可能需要完成健康檢查並參加安全課程，也可能要接受評估思考、記憶與資訊處理能力的測驗。新加坡同樣推出措施，要求六十五歲以上的駕駛人在換照前須符合特定的醫療標準。支持這些政策的人主張，這有助於找出因老化而駕駛能力衰退的人，從而降低道路上的潛在風險。

其他國家則偏好較有彈性的自律制度。在美國，規定因州而異，有些州要求高齡駕駛做視力檢查或更頻繁地換照。澳洲採取類似的各州自訂方式，要求從某些州的年度健康評估，到維多利亞州與塔斯馬尼亞州等地完全沒有年齡門檻，各不相同。這些國家普遍認為，與其強加一致的年齡規定，不如依每個人的健康與身體機能狀況個別評估其駕駛能力。

在主管機關公布涉及高齡駕駛的死亡事故細節之後，輿論往往會轉向。這類事件可能引發對更嚴格法規的呼聲，但許多專家認為，限制高齡駕駛只是解方的一部分。他們主張政府也應改善大眾運輸、社區接駁服務與其他替代方案，好讓長者不必完全依賴汽車也能維持獨立。歸根究柢，目標是建立一套既保障公共安全、又能維護高齡人口行動能力與尊嚴的制度。`,

            C:"Socially ranked and reflecting personal status.　具社會排序且反映個人地位的。",
            D:"Connected to finances and involving economic issues.　與財務相關並涉及經濟議題的。"
          }, answer:"A",
          translation:"下列何者與粗體片語 high-profile 的意思最接近？",
          explain:{
            A:"上下文是最好的字典：Several high-profile traffic incidents, widely covered by the media, have prompted governments to review their policies——緊接其後的 widely covered by the media（受媒體廣泛報導）就是這個字的同位解釋，而能促使政府檢討政策的事件，必然是引起輿論關注的。",
            B:"這是把 profile 誤解為「側臉、輪廓」的字面義。profile 確實有這個意思，但 high-profile 是固定的複合形容詞，指「高曝光度的」。",
            C:"這是把 high 誤讀成「地位高」。high-profile 講的是能見度，不是社會階級。",
            D:"與財務完全無關，屬憑空聯想。"
          },
          evidence:"Several high-profile traffic incidents, widely covered by the media, have prompted governments to review their policies regarding elderly drivers.",
          notes:[
            {term:"high-profile", pos:"adj.", gloss:"高曝光度的、備受矚目的（反義 low-profile 低調的；keep a low profile 保持低調）", ex:"She took a high-profile role in the campaign.", exZh:"她在這場活動中擔任了引人注目的角色。"},
            {term:"同位語就是答案", pos:"技巧", gloss:"字義題若該字後面緊跟一個逗號加分詞片語或同位語，那多半就是命題者留的解釋。先看緊鄰的句子，不要急著回想單字。"}
          ]},

        { n:42, kind:"細節判斷",
          stem:"Which of the following statements is true according to the article?",
          options:{
            A:"Older drivers in both Taiwan and Australia are assessed based on personal health rather than age.　台灣與澳洲的高齡駕駛都依個人健康而非年齡受評估。",
            B:"Elderly drivers in both Taiwan and Japan must pass health tests once they turn 70.　台灣與日本的高齡駕駛都必須在滿七十歲後通過健康檢查。",
            C:"Senior drivers in the US face different renewal requirements depending on where they live.　美國的高齡駕駛依居住地不同而面對不同的換照要求。",
            D:"Drivers in both Singapore and Japan are only required to renew their licenses after turning 75.　新加坡與日本的駕駛都只需在滿七十五歲後換照。"
          }, answer:"C",
          translation:"根據本文，下列敘述何者為真？",
          explain:{
            A:"台灣被歸在第二段的「嚴格規範」一組，明確採用年齡門檻（from age 70）；澳洲才是第三段的個別評估。把兩個不同陣營的國家綁在一起，是本題的典型陷阱。",
            B:"數字錯誤。文中寫得很清楚：in Taiwan from age 70, and in Japan from age 75——兩國門檻不同，日本是七十五歲。看到 both ... 就要把每一國分開回原文核對。",
            C:"第三段直接支持：In the US, regulations vary by state, with some requiring vision tests or more frequent renewals for senior drivers。vary by state（因州而異）正是選項中 depending on where they live 的同義改寫。",
            D:"新加坡的門檻是六十五歲（aged 65 and above），不是七十五歲。同樣是把兩國的數字混為一談。"
          },
          evidence:"In the US, regulations vary by state, with some requiring vision tests or more frequent renewals for senior drivers.",
          notes:[
            {term:"both A and B 的陷阱", pos:"技巧", gloss:"選項若用 both／all 把兩個以上的對象綁在一起，就要逐一回原文核對——只要其中一個對不上，整個選項就是錯的。本題的 (A)(B)(D) 全是這種錯法。"},
            {term:"vary by", pos:"phr.", gloss:"因…而異（vary by state／season／region）", ex:"Prices vary by region.", exZh:"價格因地區而異。"}
          ]}
      ]
    }]
  },

  /* ===================== 五、翻譯 ===================== */
  {
    id:"translation", label:"二之五、翻譯", score:"6% · 每題 3%",
    instruction:"將下列中文句子譯成正確、通順、達意的英文。斜線為評分斷點。",
    groups:[{
      questions:[
        { n:43, kind:"中譯英　第 1 題（3%）",
          prompt:"如果教育制度只重視考試成績，可能會面臨越來越多的輿論批評。",
          answerText:"If the education system // focuses only on test scores //, it may face growing public criticism.",
          why:"評分分成三段，每段各佔一分。三個要留意的地方：第一，主詞 the education system 是單數，條件句用現在簡單式，動詞要加 -s（focuses），這是最常見的失分點。第二，「只重視」用 focus only on 或 places emphasis only on；副詞 only 要緊貼被限定的成分，放在 on 前面。第三，「越來越多的輿論批評」用 growing public criticism——criticism 是不可數名詞，不可寫成 criticisms 或加 a。另外主要子句用 may face 表推測，不要寫成 will face，中文的「可能」是關鍵。",
          notes:[
            {term:"criticism", pos:"n.", gloss:"批評（不可數；v. criticize／n. critic 批評者）", ex:"The plan drew heavy criticism.", exZh:"這項計畫招致嚴厲批評。"},
            {term:"if 條件句的時態", pos:"文法", gloss:"表未來的可能：if ＋ 現在式，主要子句 will／may ＋ 原形。條件句裡不可用 will。"},
            {term:"growing", pos:"adj.", gloss:"日益增加的（a growing number of／growing concern）"}
          ]},

        { n:44, kind:"中譯英　第 2 題（3%）",
          prompt:"為了在數位時代更好地保護消費者，新的網路廣告規則應該盡快生效。",
          answerText:"To better protect consumers in the digital age //, new rules on online advertising // should take effect as soon as possible.",
          why:"同樣分三段計分。第一段的「為了…」用不定詞片語 To better protect... 置於句首表目的；注意副詞 better 放在 to 與原形動詞之間（分裂不定詞），這在現代英文中完全可接受，寫成 To protect consumers better 也對。第二段「網路廣告規則」的介系詞用 on（rules on／about），不是 of。第三段「生效」是 take effect，也可用 come into effect／force；「盡快」是 as soon as possible。整句主詞是 new rules（複數），助動詞 should 後接原形，沒有單複數問題。",
          notes:[
            {term:"take effect", pos:"phr.", gloss:"（法規、藥物）生效、開始起作用（＝come into effect）", ex:"The new law takes effect on January 1.", exZh:"新法於一月一日生效。"},
            {term:"rules on / regulations on", pos:"用法", gloss:"關於…的規定；介系詞用 on 或 governing，不用 of。"},
            {term:"分裂不定詞", pos:"文法", gloss:"to ＋ 副詞 ＋ 原形動詞（to better understand）。傳統文法反對，現代英文已普遍接受。"}
          ]}
      ]
    }]
  }
  ]
};

/* ==========================================================================
   ②  以下為程式碼，一般情況不需要修改。
   ========================================================================== */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const wordOf = q => q.options ? q.options[q.answer] : (q.answerText || '');
const allQ = [];
EXAM.sections.forEach(s => s.groups.forEach(g => g.questions.forEach(q => allQ.push(q))));
const findQ = n => allQ.find(q => String(q.n) === String(n));

document.getElementById('brand').textContent = EXAM.brand;
document.getElementById('examTitle').textContent = EXAM.title;
document.getElementById('examMeta').textContent = EXAM.meta;

let noteCount = 0;
allQ.forEach(q => noteCount += (q.notes || []).length);

const nav = document.getElementById('nav');
EXAM.sections.forEach(s => {
  const a = document.createElement('a');
  a.className = 'chip'; a.href = '#sec-' + s.id; a.textContent = s.label.replace(/^[一二三四五六]、/, m => m);
  nav.appendChild(a);
});
const noteChip = document.createElement('a');
noteChip.className = 'chip'; noteChip.href = '#side'; noteChip.textContent = '重點表 ' + noteCount;
nav.appendChild(noteChip);
const toggleAll = document.createElement('button');
toggleAll.className = 'chip solid'; toggleAll.textContent = '全部展開';
nav.appendChild(toggleAll);

function renderPassage(g, i, sid) {
  let html = esc(g.passage);
  g.questions.forEach(q => {
    if (!q.evidence) return;
    const t = esc(q.evidence);
    if (html.includes(t)) html = html.replace(t, `<span class="hl ev" data-ev="${q.n}">${t}</span>`);
  });
  html = html.replace(/__(\d+)__/g, (m, n) =>
    `<button class="blank" data-blank="${n}" aria-label="第 ${n} 題空格">${n}</button>`);
  const body = '<div class="passage">' +
    html.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, ' ') + '</p>').join('') + '</div>';
  if (!g.zh) return body;
  const id = sid + '-' + i;
  return body +
    `<button class="zhbtn" data-zh="${id}">全文中譯</button>` +
    `<div class="zhbox" id="zh-${id}">` +
      g.zh.split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g, ' ') + '</p>').join('') +
    '</div>';
}

function renderQ(q) {
  const parts = [];
  if (q.options) {
    const ks = Object.keys(q.options);
    parts.push('<div class="opts">' + ks.map(k =>
      `<div class="opt"><span class="opt-k">(${k})</span><span>${esc(q.options[k])}</span></div>`).join('') + '</div>');
  }
  const head = `<div class="q-tag"><span class="q-n">${String(q.n).padStart(2,'0')}</span><span class="q-kind">${esc(q.kind || '')}</span></div>` +
    (q.prompt ? `<p class="prompt">${esc(q.prompt)}</p>` : '') +
    (q.stem ? `<p class="stem">${esc(q.stem).replace(/\n/g,'<br>')}</p>` : '');

  let ans = '';
  if (q.answers) {
    ans = '<ul class="fills">' + q.answers.map(a =>
      `<li class="fill"><span class="fill-k">${esc(a.k)}</span><span class="fill-w hl" data-ansmulti>${esc(a.w)}</span><span class="fill-n">${esc(a.note || '')}</span></li>`).join('') + '</ul>';
  } else {
    const label = q.options ? `(${q.answer}) ${esc(wordOf(q))}` :
      (q.answer ? `(${q.answer}) ${esc(q.answerText)}` : esc(q.answerText));
    ans = `<p class="ans"><span class="ans-k">答案</span><span class="ans-v hl" data-ans="${q.n}">${label}</span></p>`;
  }

  let expl = '';
  if (q.explain) {
    expl = '<ul class="lines">' + Object.keys(q.options).map(k => {
      const right = q.multi ? q.multi.includes(k) : k === q.answer;
      return `<li class="line ${right ? 'right' : 'wrong'}"><span class="line-k">(${k})</span><span>${esc(q.explain[k] || '')}</span></li>`;
    }).join('') + '</ul>';
  }
  const why = q.why ? `<p class="why">${esc(q.why)}</p>` : '';
  const sample = q.sample ? `<div class="sample"><p class="note-h">參考範文</p>` +
    q.sample.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g,' ')}</p>`).join('') + '</div>' : '';
  const evid = q.evidence ? `<p class="evid"><span>文中依據</span>${esc(q.evidence)}</p>` : '';
  const notes = (q.notes || []).length ? `<div class="note"><p class="note-h">重點整理</p>` +
    q.notes.map(nt => `<p class="note-i"><span class="term">${esc(nt.term)}</span><span class="pos">${esc(nt.pos || '')}</span><span class="gloss">${esc(nt.gloss || '')}</span>` +
      (nt.ex ? `<span class="ex">${esc(nt.ex)}<i>${esc(nt.exZh || '')}</i></span>` : '') + '</p>').join('') + '</div>' : '';

  return `<article class="q" id="q-${q.n}" data-n="${q.n}">
    <div class="q-top">${head}${parts.join('')}
      <button class="reveal" aria-expanded="false" aria-controls="body-${q.n}">看詳解</button>
    </div>
    <div class="body" id="body-${q.n}">
      ${ans}${q.translation ? `<p class="zh">${esc(q.translation)}</p>` : ''}${expl}${why}${evid}${sample}${notes}
    </div>
  </article>`;
}

document.getElementById('main').innerHTML = EXAM.sections.map((s, i) => `
  <section class="sec" id="sec-${s.id}">
    <div class="sec-head">
      <span class="sec-num">${String(i+1).padStart(2,'0')}</span>
      <h2 class="sec-label">${esc(s.label)}</h2>
      <span class="sec-score">${esc(s.score || '')}</span>
    </div>
    ${s.instruction ? `<p class="sec-inst">${esc(s.instruction)}</p>` : ''}
    ${s.bank ? `<div class="bank${s.bankWide ? ' wide' : ''}">${Object.keys(s.bank).map(k =>
      `<div class="bank-i" data-bank="${k}"><span>(${k})</span>${esc(s.bank[k])}</div>`).join('')}</div>` : ''}
    ${s.groups.map((g, gi) => (g.passage ? renderPassage(g, gi, s.id) : '') + g.questions.map(renderQ).join('')).join('')}
  </section>`).join('');

const items = [];
allQ.forEach(q => (q.notes || []).forEach(nt => items.push({ ...nt, n: q.n })));
document.getElementById('side').innerHTML = `
  <p class="side-h">Notes</p>
  <p class="side-t">本卷重點 ${items.length} 則</p>
  <ul class="card-list">${items.map(nt => `
    <li class="card-item"><a href="#q-${nt.n}">
      <span class="jump">第 ${nt.n} 題</span>
      <span class="term">${esc(nt.term)}</span><span class="pos">${esc(nt.pos || '')}</span>
      <div class="gloss">${esc(nt.gloss || '')}</div>
    </a></li>`).join('')}</ul>
  <p class="side-note">點任一則可跳到出處題目。用瀏覽器列印（Ctrl／⌘ + P）會自動展開全部詳解與中譯，可直接印成講義。</p>`;

document.getElementById('foot').textContent = `共 ${allQ.length} 題 · ${EXAM.footer}`;

function setOpen(card, open) {
  card.classList.toggle('open', open);
  const btn = card.querySelector('.reveal');
  btn.setAttribute('aria-expanded', open);
  btn.firstChild.nodeValue = open ? '收合詳解' : '看詳解';
  const n = card.dataset.n;
  card.querySelectorAll('.hl').forEach(h => h.classList.toggle('on', open));
  const ev = document.querySelector(`[data-ev="${n}"]`);
  if (ev) ev.classList.toggle('on', open);
  const q = findQ(n);
  if (q && q.answer && q.answerText) {
    const bi = document.querySelector(`[data-bank="${q.answer}"]`);
    if (bi) bi.classList.toggle('used', open);
  }
  const bl = document.querySelector(`[data-blank="${n}"]`);
  if (bl) {
    if (open) {
      bl.classList.add('filled');
      bl.innerHTML = `<sup>${n}</sup><span class="hl">${esc(wordOf(q))}</span>`;
      requestAnimationFrame(() => bl.querySelector('.hl').classList.add('on'));
    } else {
      bl.classList.remove('filled');
      bl.textContent = n;
    }
  }
}
document.addEventListener('click', e => {
  const rv = e.target.closest('.reveal');
  if (rv) { const c = rv.closest('.q'); setOpen(c, !c.classList.contains('open')); return; }
  const zb = e.target.closest('.zhbtn');
  if (zb) { zb.classList.toggle('on'); document.getElementById('zh-' + zb.dataset.zh).classList.toggle('on'); return; }
  const bl = e.target.closest('.blank');
  if (bl) {
    const c = document.getElementById('q-' + bl.dataset.blank);
    if (!c.classList.contains('open')) setOpen(c, true);
    c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
});
toggleAll.addEventListener('click', () => {
  const open = toggleAll.textContent === '全部展開';
  document.querySelectorAll('.q').forEach(c => setOpen(c, open));
  toggleAll.textContent = open ? '全部收合' : '全部展開';
});
window.addEventListener('beforeprint', () => {
  document.querySelectorAll('.q').forEach(c => setOpen(c, true));
  document.querySelectorAll('.zhbox').forEach(b => b.classList.add('on'));
  toggleAll.textContent = '全部收合';
});
</script>
</body>
</html>
