  {
    id:"rd", label:"三、閱讀測驗", score:"6%（第 41-43 題，每題 2%）",
    groups:[{
      passage:`The Christmas Truce of 1914 was a rare moment of kindness during World War I. On the Western Front, which stretched from Belgium to Switzerland, about 100,000 British, German, and French soldiers joined in unofficial ceasefires. For a short time, the violence of war gave way to peace and humanity.

To understand how such an extraordinary pause was possible, it helps to look at the days leading up to Christmas. After the First Battle of Ypres in November 1914, opposing trenches lay so close that soldiers could even call out to one another. On December 7, Pope Benedict XV urged the nations at war to stop fighting during Christmas. Although leaders ignored his appeal, many soldiers found hope in the idea that peace, even for a single day, was possible.

When Christmas Day came, moments of humanity emerged across the front. Soldiers left their trenches to meet in the space between the front lines, known as "no man's land." They exchanged greetings, shared small presents, and even played football, though historians debate whether organized matches truly took place. They also held joint burials, honoring the fallen on both sides. In some places, carols carried across the night air. Germans sang "Silent Night" by candlelight, and soon some British soldiers joined in. For a brief moment, the front lines echoed with harmony instead of gunfire.

The peace, however, was short-lived. Military leaders quickly banned such contact, and some officers were punished for allowing it. The truce was reported in newspapers such as The New York Times, but political leaders dismissed it as merely a local event. Although smaller acts of peace continued into 1915, the heavy losses of major battles like Loos, which cost tens of thousands of lives in days, left soldiers far less willing to fraternize.

Still, the Christmas Truce reminds us that even in the darkest times, people can choose peace. It has been remembered in films, songs, and memorials, including a statue in Staffordshire, UK, and a stone marker in Frelinghien, France. Its message continues to speak to us today, offering hope that humanity can shine even in moments of war.`,
      zh:`1914 年的聖誕節休戰是第一次世界大戰期間難得的一刻善意。在從比利時延伸到瑞士的西方戰線上，約有十萬名英國、德國與法國士兵加入了非官方的停火。在短暫的一段時間裡，戰爭的暴力讓位給了和平與人性。

要理解這樣一次非凡的停頓為何可能發生，看一看聖誕節前那幾天會很有幫助。1914 年 11 月第一次伊普爾戰役之後，敵對雙方的戰壕相距如此之近，士兵甚至可以互相喊話。12 月 7 日，教宗本篤十五世呼籲交戰各國在聖誕節期間停止戰鬥。雖然領導人忽視了他的呼籲，許多士兵卻從「和平，哪怕只有一天，是有可能的」這個念頭中找到了希望。

聖誕節當天，人性的時刻在整條戰線上浮現。士兵離開戰壕，在前線之間那片被稱為「無人之地」的空間裡會面。他們互道問候、分送小禮物，甚至踢起足球——儘管史學家仍爭論是否真的有過有組織的比賽。他們也舉行了聯合葬禮，一同追悼雙方的陣亡者。在某些地方，聖誕頌歌飄盪在夜空中。德軍在燭光下唱起《平安夜》，不久後一些英軍也跟著加入。在短暫的一刻，前線迴盪的是和聲而不是槍聲。

然而這份和平並不長久。軍事領導人迅速禁止這類接觸，一些軍官還因為放任而受到懲處。這場休戰曾被《紐約時報》等報紙報導，但政治領導人把它貶為只是一起地方性事件。雖然較小規模的和平舉動延續到了 1915 年，但像盧斯戰役這樣的大型戰役在數日內就奪走數萬條性命，慘重的傷亡讓士兵遠遠不再願意與敵人友好相處。

儘管如此，聖誕節休戰提醒我們：即使在最黑暗的時刻，人們依然可以選擇和平。它被記錄在電影、歌曲與紀念物之中，包括英國斯塔福郡的一座雕像，以及法國弗雷林吉安的一塊石碑。它的訊息至今仍對我們說話，帶來一份希望——人性即使在戰爭的時刻也能閃耀。`,
      questions:[
        { n:41, kind:"細節題",
          stem:"What happened during the Christmas Truce of 1914?",
          options:{A:"Soldiers from warring countries stopped fighting. 交戰國的士兵停止了戰鬥。",B:"Leaders of warring countries agreed to a temporary ceasefire. 交戰國的領導人同意了一次暫時停火。",C:"The pope secured long-term peace in Europe through his negotiations. 教宗透過談判為歐洲爭取到長期和平。",D:"All European countries at war agreed to celebrate Christmas together. 所有參戰的歐洲國家都同意一起慶祝聖誕節。"}, answer:"A",
          translation:"1914 年的聖誕節休戰期間發生了什麼事？",
          explain:{A:"✔ 第一段明確寫出 about 100,000 British, German, and French soldiers joined in unofficial ceasefires（約十萬名英、德、法士兵加入非官方停火），第三段更具體描述他們離開戰壕互道問候。停止戰鬥的主體是「士兵」，與選項完全一致。",B:"✘ 錯在主體與性質兩處。第一段說這是 unofficial ceasefires（非官方停火），第二段又說 leaders ignored his appeal（領導人忽視教宗呼籲），第四段還說 Military leaders quickly banned such contact（軍事領導人迅速禁止），可見領導人從未同意。",C:"✘ 第二段只說教宗 urged the nations at war to stop fighting（呼籲交戰國停火），緊接著就是 Although leaders ignored his appeal（但領導人忽視了他的呼籲）。他既沒有進行談判，更沒有爭取到長期和平。",D:"✘ All（所有）過於絕對。文中列出的是 British, German, and French soldiers，而且是士兵自發的行為，並非國家層級的共同決定；第四段的 merely a local event（只是地方性事件）也否定了全面性。"},
          evidence:"第 1 段：about 100,000 British, German, and French soldiers joined in unofficial ceasefires.",
          notes:[{term:"細節題的刪除法", pos:"閱讀技巧", gloss:"四個選項常只錯在一個關鍵詞：主體（soldiers 還是 leaders）、性質（unofficial 還是 agreed）、範圍（all 還是 some）、結果（long-term 還是 brief）。回原文比對這四個面向，比通讀全文更快。"},{term:"ceasefire / truce", pos:"字彙", gloss:"ceasefire 停火（declare／violate a ceasefire）／truce 休戰（call a truce）。相關：armistice 停戰協定／warring countries 交戰國／the front 前線。"},{term:"give way to", pos:"片語", gloss:"讓位給、被…取代（The violence gave way to peace.）；也指「讓路、屈服」（give way to pressure）。"}]},

        { n:42, kind:"推論題",
          stem:"Which of the following is implied in the article?",
          options:{A:"The Christmas Truce was secretly allowed by military leaders. 聖誕節休戰其實得到軍事領導人的暗中允許。",B:"The Christmas Truce has been widely portrayed in pop culture. 聖誕節休戰已被大眾文化廣泛呈現。",C:"The Christmas Truce spread to other battlefields not long afterwards. 聖誕節休戰不久後就擴散到其他戰場。",D:"The Christmas Truce received little coverage until the end of the war. 聖誕節休戰直到戰爭結束才獲得報導。"}, answer:"B",
          translation:"下列哪一項是本文所暗示的？",
          explain:{B:"✔ 最後一段說 It has been remembered in films, songs, and memorials（它被記錄在電影、歌曲與紀念物中），並舉出英國的雕像與法國的石碑。電影與歌曲正屬大眾文化，這是文中雖未直說 pop culture 但可合理推得的結論。",A:"✘ 與文意相反。第四段明說 Military leaders quickly banned such contact, and some officers were punished for allowing it（軍事領導人迅速禁止這類接觸，一些軍官因放任而受罰），完全沒有「暗中允許」的意思。",C:"✘ 第四段只說 smaller acts of peace continued into 1915（較小規模的和平舉動延續到 1915 年），指的是規模縮小而非向外擴散；而且同句接著說慘重傷亡讓士兵更不願意與敵方友好，趨勢是減弱而非蔓延。",D:"✘ 第四段明確寫 The truce was reported in newspapers such as The New York Times（曾被《紐約時報》等報紙報導），可見當時就有報導。文中被淡化處理的是「政治領導人的態度」（dismissed it as merely a local event），不是媒體的報導量。"},
          evidence:"第 5 段：It has been remembered in films, songs, and memorials, including a statue in Staffordshire, UK, and a stone marker in Frelinghien, France.",
          notes:[{term:"implied 題的範圍", pos:"閱讀技巧", gloss:"推論題的答案必須「以文中敘述為基礎再走一小步」：films, songs, and memorials → pop culture 是合理的歸納。若一個選項需要補進文中沒有的事實（如「暗中允許」），或與文中句子直接衝突（如「直到戰後才被報導」），就一定是錯的。"},{term:"portray", pos:"v.", gloss:"描繪、刻畫（be portrayed in films／portray sb as a hero）。n. portrayal 描繪。相關：memorial 紀念物／statue 雕像／marker 標記石碑。"},{term:"dismiss sth as sth", pos:"片語", gloss:"把…貶為（dismissed it as merely a local event）。本卷第 27 題的文意選填段落也用了這個句型（dismiss them as myths），兩處可互相對照。"}]},

        { n:43, kind:"字義推測題",
          stem:"What does the bold word \"fraternize\" in the fourth paragraph most likely mean?",
          options:{A:"To have fun with friends. 與朋友玩樂。",B:"To fight for noble causes. 為崇高的理想而戰。",C:"To work together closely. 緊密地合作共事。",D:"To be friendly with enemies. 與敵人友好相處。"}, answer:"D",
          translation:"第四段中的粗體字 fraternize 最可能是什麼意思？",
          explain:{D:"✔ 把這個字放回上下文：慘重傷亡 left soldiers far less willing to fraternize（讓士兵遠遠不再願意 fraternize）。而前面第三段描述的正是雙方士兵互道問候、交換禮物、合辦葬禮、一起唱歌——與敵方友好往來。第四段開頭又說 Military leaders quickly banned such contact（軍事領導人禁止這類接觸），能被軍方禁止的只可能是「與敵人親近」，所以答案是 D。",A:"✘ 範圍太窄也抓錯對象。文中的互動發生在敵對雙方之間，重點不在「朋友」；而且若只是與自己的朋友玩樂，軍方沒有理由下禁令。",B:"✘ 為崇高理想而戰是「作戰」，但本段的脈絡正好相反：士兵因傷亡慘重而更願意作戰、更不願意友好往來。方向完全顛倒。",C:"✘ 緊密合作適用於同一陣營的隊友或同事；文中雙方是敵人，而且 fraternize 的重點在感情上的親近，不在共同完成工作。這是四個選項中最接近的誘答，差別就在「有沒有敵對關係」這一層。"},
          evidence:"第 3 段的具體行為（exchanged greetings, shared small presents, held joint burials）＋第 4 段 Military leaders quickly banned such contact 與 left soldiers far less willing to fraternize。",
          notes:[{term:"fraternize", pos:"v.", gloss:"與（敵人或不該親近的對象）友好往來（fraternize with the enemy／fraternize with students）。n. fraternity 兄弟情誼、（美國大學的）兄弟會。字根 frater＝兄弟：fraternal 手足的／fratricide 殺害手足。", ex:"Officers were forbidden to fraternize with enlisted soldiers.", exZh:"軍官被禁止與士兵過從親近。"},{term:"猜字義三步法", pos:"閱讀技巧", gloss:"① 看該字所在句的邏輯（less willing to＋負面轉折）② 往前找同義改寫（such contact 指第三段的互動）③ 用選項代回原句檢查是否通順。本題的 such contact 就是最關鍵的同義線索。"},{term:"short-lived", pos:"adj.", gloss:"短暫的（The peace was short-lived.）。注意 lived 在此讀 /laɪvd/，源自名詞 life。相關：fleeting 短暫的／brief 短暫的。"}]}

        { n:44, kind:"中譯英 3%",
          stem:"當人們只是為了仿效而購買奢侈品時，他們可能會忘記自己是否真的需要這些商品。",
          answerText:"When people buy luxury items just to follow suit, they may forget whether they truly need them.",
          why:"三個給分段落：When people buy luxury items ／ just to follow suit ／ they may forget whether they truly need them。「為了仿效」用 follow suit（跟著照做、效法），前面加 just to 表「只是為了」；「是否」用 whether 引導名詞子句當 forget 的受詞（口語雖可用 if，但 whether 在書面與正式測驗中更穩）。注意 them 回指 luxury items，不要寫成 these goods 以外的不一致形式。",
          notes:[{term:"follow suit", pos:"片語", gloss:"跟著照做、效法（Several airlines soon followed suit.）。源自橋牌「跟出同花色」。同義：do likewise／follow sb's example／jump on the bandwagon（趕流行，偏負面）。", ex:"When one store cut prices, the others quickly followed suit.", exZh:"一家店降價後，其他店很快跟著照做。"},{term:"whether 引導名詞子句", pos:"句型", gloss:"forget／wonder／ask／doubt＋whether＋S＋V（是否）。注意 whether 後面接完整子句，不可寫成 whether to need；而介系詞之後只能用 whether 不能用 if。"},{term:"luxury", pos:"n. / adj.", gloss:"奢侈（品）（luxury items／goods／a luxury car；live in luxury）。adj. luxurious 奢華的（注意兩個形容詞的差別：luxury＋名詞是「奢侈品類的」，luxurious 是「感覺奢華的」）。"}]},

        { n:45, kind:"中譯英 3%",

          answerText:"Over time, random buying decisions may blur the boundary between personal choice and social pressure.",
          why:"三個給分段落：Over time, random buying decisions ／ may blur the boundary between ／ personal choice and social pressure。「久而久之」用 Over time；「模糊…的邊界」是 blur the boundary（或 line）between A and B，between 後面必須有 A and B 兩者，缺一不可。注意 personal choice 與 social pressure 都是抽象不可數名詞，前面不加冠詞。",
          notes:[{term:"blur the line / boundary between A and B", pos:"片語", gloss:"模糊 A 與 B 之間的界線（blur the line between work and leisure）。v. blur 使模糊；adj. blurry 模糊的。本卷第 5 題把 blur 放在誘答，第 26 題所在的段落也用了 blur the line between fact and fiction，三處可互相對照。", ex:"Remote work has blurred the boundary between office and home.", exZh:"遠距工作模糊了辦公室與家之間的界線。"},{term:"over time", pos:"片語", gloss:"久而久之、隨著時間（Over time, habits form.）。對照 in time 及時、終究／on time 準時／at a time 一次（若干）。"},{term:"random", pos:"adj.", gloss:"隨機的、沒有特定原因的（random decisions／at random 隨機地）。adv. randomly；n. randomness。"}]},

        { n:46, kind:"中譯英 4%",
          stem:"隨著海洋保護的觀念在社會中扎根，越來越多人願意減少塑膠垃圾。",
          answerText:"As ideas about marine protection take root in society, more and more people are willing to reduce plastic waste.",
          why:"四個給分段落：As ideas about marine protection ／ take root in society, ／ more and more people are willing to ／ reduce plastic waste。「隨著」用 As 引導副詞子句；「扎根」正是 take root in（注意主詞 ideas 是複數，動詞用原形 take，不加 s）。「越來越多人」用 more and more people，動詞用複數 are；「願意」用 be willing to V；plastic waste 為不可數，不加 s。本卷第 20 題的誘答正是 takes root in，當時因為受詞是兩個單字而不適用，這裡才是它的正確用法。",
          notes:[{term:"take root in", pos:"片語", gloss:"在…扎根、開始被接受（The idea has taken root in society.）。n. root 根（put down roots 定居／the root of the problem 問題的根源）。同義：become established／gain acceptance／catch on。", ex:"Democratic habits took root slowly in the new republic.", exZh:"民主習慣在這個新共和國裡慢慢扎下了根。"},{term:"be willing to V", pos:"片語", gloss:"願意做某事（be willing to help／be more than willing to V 非常樂意）。n. willingness；反義 be reluctant／unwilling to V。"},{term:"marine", pos:"adj.", gloss:"海洋的（marine protection／marine life 海洋生物／a marine biologist）。相關：maritime 海事的／coastal 沿海的／conservation 保育。本卷第 15 題的題幹也出現 marine life。"}]},

        { n:47, kind:"中譯英 4%",
          stem:"為了讓這樣的改變持續下去，需要可靠的科學證據來使環境警告更有說服力。",

          why:"四個給分段落：To keep this change going, ／ solid scientific evidence is needed ／ to make environmental warnings ／ more convincing。「為了讓…持續下去」用 To keep sth going（keep＋受詞＋V-ing 表「使某事持續」）；「需要」用被動 is needed（evidence 不可數，動詞用單數 is）；「使…更有說服力」用 make＋受詞＋形容詞比較級，即 make warnings more convincing。注意 convincing 正是本卷第 26 題的答案，可以互相印證。",
          notes:[{term:"keep sth going", pos:"片語", gloss:"使某事持續下去（keep this change going／keep the conversation going／keep the engine running）。句型是 keep＋O＋V-ing。對照 keep sb from V-ing 阻止某人做某事。", ex:"Small grants helped keep the project going for another year.", exZh:"幾筆小額補助讓這個計畫又多撐了一年。"},{term:"solid evidence", pos:"片語", gloss:"紮實可靠的證據（solid scientific evidence／solid proof）。adj. solid 在此是「可靠、確實的」（a solid argument）。本卷第 27 題所在的句子也用了 solid historical backing，可互相對照。"},{term:"make + O + adj.", pos:"句型", gloss:"使某物變成某狀態（make warnings more convincing／make it easier to V）。本卷第 22 題的題幹正是同一句型（makes every throw unpredictable），翻譯與閱讀可一起複習。"}]}
      ]
    }]
  }

};

/* ==========================================================================
   ②  以下為程式碼，一般情況不需要修改。
   ========================================================================== */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const wordOf = q => q.options ? q.options[q.answer] : (q.answerText || '');
const allQ = [];
EXAM.sections.forEach(s => s.groups.forEach(g => g.questions.forEach(q => { q.__sid = s.id; allQ.push(q); })));
const findQ = (n, sid) => allQ.find(q => String(q.n) === String(n) && (sid == null || q.__sid === sid));

document.getElementById('brand').textContent = EXAM.brand;
document.getElementById('examTitle').textContent = EXAM.title;
document.getElementById('examMeta').textContent = EXAM.meta;

let noteCount = 0;
allQ.forEach(q => noteCount += (q.notes || []).length);

const nav = document.getElementById('nav');
EXAM.sections.forEach(s => {
  const a = document.createElement('a');
  a.className = 'chip'; a.href = '#sec-' + s.id; a.textContent = s.label.replace(/^[一二三四五六]、/, m => m);
  nav.appendChild(a);
});
const noteChip = document.createElement('a');
noteChip.className = 'chip'; noteChip.href = '#side'; noteChip.textContent = '重點表 ' + noteCount;
nav.appendChild(noteChip);
const toggleAll = document.createElement('button');
toggleAll.className = 'chip solid'; toggleAll.textContent = '全部展開';
nav.appendChild(toggleAll);

function renderPassage(g, i, sid) {
  let html = esc(g.passage);
  g.questions.forEach(q => {
    if (!q.evidence) return;
    const t = esc(q.evidence);
    if (html.includes(t)) html = html.replace(t, `<span class="hl ev" data-ev="${q.n}">${t}</span>`);
  });
  html = html.replace(/__(\d+)__/g, (m, n) =>
    `<button class="blank" data-blank="${n}" aria-label="第 ${n} 題空格">${n}</button>`);
  const body = '<div class="passage">' +
    html.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, ' ') + '</p>').join('') + '</div>';
  if (!g.zh) return body;
  const id = sid + '-' + i;
  return body +
    `<button class="zhbtn" data-zh="${id}">全文中譯</button>` +
    `<div class="zhbox" id="zh-${id}">` +
      g.zh.split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g, ' ') + '</p>').join('') +
    '</div>';
}

function renderQ(q) {
  const parts = [];
  if (q.options) {
    const ks = Object.keys(q.options);
    parts.push('<div class="opts">' + ks.map(k =>
      `<div class="opt"><span class="opt-k">(${k})</span><span>${esc(q.options[k])}</span></div>`).join('') + '</div>');
  }
  const head = `<div class="q-tag"><span class="q-n">${String(q.n).padStart(2,'0')}</span><span class="q-kind">${esc(q.kind || '')}</span></div>` +
    (q.prompt ? `<p class="prompt">${esc(q.prompt)}</p>` : '') +
    (q.stem ? `<p class="stem">${esc(q.stem).replace(/\n/g,'<br>')}</p>` : '');

  let ans = '';
  if (q.answers) {
    ans = '<ul class="fills">' + q.answers.map(a =>
      `<li class="fill"><span class="fill-k">${esc(a.k)}</span><span class="fill-w hl" data-ansmulti>${esc(a.w)}</span><span class="fill-n">${esc(a.note || '')}</span></li>`).join('') + '</ul>';
  } else {
    const label = q.options ? `(${q.answer}) ${esc(wordOf(q))}` :
      (q.answer ? `(${q.answer}) ${esc(q.answerText)}` : esc(q.answerText));
    ans = `<p class="ans"><span class="ans-k">答案</span><span class="ans-v hl" data-ans="${q.n}">${label}</span></p>`;
  }

  let expl = '';
  if (q.explain) {
    expl = '<ul class="lines">' + Object.keys(q.options).map(k => {
      const right = q.multi ? q.multi.includes(k) : k === q.answer;
      return `<li class="line ${right ? 'right' : 'wrong'}"><span class="line-k">(${k})</span><span>${esc(q.explain[k] || '')}</span></li>`;
    }).join('') + '</ul>';
  }
  const why = q.why ? `<p class="why">${esc(q.why)}</p>` : '';
  const sample = q.sample ? `<div class="sample"><p class="note-h">參考範文</p>` +
    q.sample.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g,' ')}</p>`).join('') + '</div>' : '';
  const evid = q.evidence ? `<p class="evid"><span>文中依據</span>${esc(q.evidence)}</p>` : '';
  const notes = (q.notes || []).length ? `<div class="note"><p class="note-h">重點整理</p>` +
    q.notes.map(nt => `<p class="note-i"><span class="term">${esc(nt.term)}</span><span class="pos">${esc(nt.pos || '')}</span><span class="gloss">${esc(nt.gloss || '')}</span>` +
      (nt.ex ? `<span class="ex">${esc(nt.ex)}<i>${esc(nt.exZh || '')}</i></span>` : '') + '</p>').join('') + '</div>' : '';

  return `<article class="q" id="q-${q.__sid}-${q.n}" data-n="${q.n}" data-sid="${q.__sid}">
    <div class="q-top">${head}${parts.join('')}
      <button class="reveal" aria-expanded="false" aria-controls="body-${q.n}">看詳解</button>
    </div>
    <div class="body" id="body-${q.n}">
      ${ans}${q.translation ? `<p class="zh">${esc(q.translation)}</p>` : ''}${expl}${why}${evid}${sample}${notes}
    </div>
  </article>`;
}

document.getElementById('main').innerHTML = EXAM.sections.map((s, i) => `
  <section class="sec" id="sec-${s.id}">
    <div class="sec-head">
      <span class="sec-num">${String(i+1).padStart(2,'0')}</span>
      <h2 class="sec-label">${esc(s.label)}</h2>
      <span class="sec-score">${esc(s.score || '')}</span>
    </div>
    ${s.instruction ? `<p class="sec-inst">${esc(s.instruction)}</p>` : ''}
    ${s.bank ? `<div class="bank${s.bankWide ? ' wide' : ''}">${Object.keys(s.bank).map(k =>
      `<div class="bank-i" data-bank="${k}"><span>(${k})</span>${esc(s.bank[k])}</div>`).join('')}</div>` : ''}
    ${s.groups.map((g, gi) => (g.passage ? renderPassage(g, gi, s.id) : '') + g.questions.map(renderQ).join('')).join('')}
  </section>`).join('');

const items = [];
allQ.forEach(q => (q.notes || []).forEach(nt => items.push({ ...nt, n: q.n, sid: q.__sid })));
document.getElementById('side').innerHTML = `
  <p class="side-h">Notes</p>
  <p class="side-t">本卷重點 ${items.length} 則</p>
  <ul class="card-list">${items.map(nt => `
    <li class="card-item"><a href="#q-${nt.sid}-${nt.n}">
      <span class="jump">第 ${nt.n} 題</span>
      <span class="term">${esc(nt.term)}</span><span class="pos">${esc(nt.pos || '')}</span>
      <div class="gloss">${esc(nt.gloss || '')}</div>
    </a></li>`).join('')}</ul>
  <p class="side-note">點任一則可跳到出處題目。用瀏覽器列印（Ctrl／⌘ + P）會自動展開全部詳解與中譯，可直接印成講義。</p>`;

document.getElementById('foot').textContent = `共 ${allQ.length} 題 · ${EXAM.footer}`;

function setOpen(card, open) {
  card.classList.toggle('open', open);
  const btn = card.querySelector('.reveal');
  btn.setAttribute('aria-expanded', open);
  btn.firstChild.nodeValue = open ? '收合詳解' : '看詳解';
  const n = card.dataset.n;
  const sec = card.closest('.sec') || document;
  card.querySelectorAll('.hl').forEach(h => h.classList.toggle('on', open));
  const ev = sec.querySelector(`[data-ev="${n}"]`);
  if (ev) ev.classList.toggle('on', open);
  const q = findQ(n, card.dataset.sid);
  if (q && q.answer && q.answerText) {
    const bi = sec.querySelector(`[data-bank="${q.answer}"]`);
    if (bi) bi.classList.toggle('used', open);
  }
  const bl = sec.querySelector(`[data-blank="${n}"]`);
  if (bl) {
    if (open) {
      bl.classList.add('filled');
      bl.innerHTML = `<sup>${n}</sup><span class="hl">${esc(wordOf(q))}</span>`;
      requestAnimationFrame(() => bl.querySelector('.hl').classList.add('on'));
    } else {
      bl.classList.remove('filled');
      bl.textContent = n;
    }
  }
}
document.addEventListener('click', e => {
  const rv = e.target.closest('.reveal');
  if (rv) { const c = rv.closest('.q'); setOpen(c, !c.classList.contains('open')); return; }
  const zb = e.target.closest('.zhbtn');
  if (zb) { zb.classList.toggle('on'); document.getElementById('zh-' + zb.dataset.zh).classList.toggle('on'); return; }
  const bl = e.target.closest('.blank');
  if (bl) {
    const c = document.getElementById('q-' + bl.dataset.blank);
    if (!c.classList.contains('open')) setOpen(c, true);
    c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
});
toggleAll.addEventListener('click', () => {
  const open = toggleAll.textContent === '全部展開';
  document.querySelectorAll('.q').forEach(c => setOpen(c, open));
  toggleAll.textContent = open ? '全部收合' : '全部展開';
});
window.addEventListener('beforeprint', () => {
  document.querySelectorAll('.q').forEach(c => setOpen(c, true));
  document.querySelectorAll('.zhbox').forEach(b => b.classList.add('on'));
  toggleAll.textContent = '全部收合';
});
</script>
</body>
</html>
