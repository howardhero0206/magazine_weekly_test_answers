    groups:[{
      passage:`Few financial tales are retold as often as that of the Dutch tulip craze, widely regarded as one of the earliest recorded economic bubbles. In the familiar version, flowers introduced from the Ottoman Empire turned sober merchants into reckless gamblers. Rare bulbs, prized for their "flamed" colors, changed hands in taverns choked with eager buyers, and people from all walks of life __25__ their life savings to flowers they had never seen. Then, in February 1637, buyers stopped showing up, and prices plunged overnight. The crash, we are told, __26__ the Dutch economy and left thousands bankrupt.

It is a gripping story, but is it true? Much of the drama __27__ pamphlets written at the time by moralists who frowned upon easy money. Their aim was to warn readers against greed, not to provide an accurate account of events. The tale __28__ two centuries later, when Charles Mackay retold it in his 1841 bestseller on "the madness of crowds." Colorful details, such as a sailor who supposedly ate a priceless bulb, mistaking it for an onion, made it all the more memorable. Victorian readers, it seems, were all too happy to __29__ a tale in which greed is swiftly punished.

Only through careful historical research have scholars been able to separate fact from fiction. When Anne Goldgar set out to __30__ the legend back to its sources, she spent years combing through Dutch archives. She found that the trade involved only a relatively small number of people, with many of the major traders wealthy enough to absorb their losses. The damage, in other words, was far less __31__ than the legend suggests. No wave of bankruptcies followed. Far from collapsing, the Dutch economy remained __32__ and kept flourishing for decades. Perhaps the real lesson of tulip mania is not that crowds are foolish, but that a good story can outlive the facts.`,
      zh:`很少有金融故事像荷蘭鬱金香狂熱那樣被反覆傳述，它被廣泛視為有紀錄以來最早的經濟泡沫之一。在那個大家熟悉的版本裡，從鄂圖曼帝國引進的花朵把原本冷靜的商人變成了不顧後果的賭徒。稀有的球根因為它們「火焰狀」的花色而受到追捧，在擠滿急切買家的酒館裡轉手，而各行各業的人把一生的積蓄投入到他們從未見過的花上。然後，在一六三七年二月，買家不再出現，價格在一夜之間暴跌。我們被告知，這場崩盤癱瘓了荷蘭經濟，並讓數千人破產。

這是一個引人入勝的故事，但它是真的嗎？這齣戲碼的大部分內容源自當時由道德家們寫下的小冊子，那些人對輕鬆得來的錢財嗤之以鼻。他們的目的是警告讀者遠離貪婪，而不是提供一份準確的事件紀錄。這個故事在兩個世紀之後大為流行，當查爾斯．麥凱在他一八四一年關於「群眾的瘋狂」的暢銷書中重述了它。一些鮮明的細節，例如據說有一名水手把一顆無價的球根誤認成洋蔥吃掉了，讓整個故事更加令人難忘。看來維多利亞時代的讀者非常樂於欣然接受一個貪婪迅速受到懲罰的故事。

唯有透過仔細的歷史研究，學者們才得以把事實與虛構區分開來。當 Anne Goldgar 著手把這個傳說追溯回它的源頭時，她花了好幾年梳理荷蘭的檔案。她發現這場交易只牽涉到相對少數的人，而且許多主要交易者富有到足以吸收他們的損失。換句話說，損害遠比這個傳說所暗示的要輕微得多。並沒有出現一波破產潮。荷蘭經濟遠非崩潰，反而維持健全，並持續繁榮了數十年。也許鬱金香狂熱真正的教訓不是群眾很愚蠢，而是一個好故事可以活得比事實更久。`,
      questions:[
        { n:25, kind:"動詞（過去式．投入）", answer:"A", answerText:"committed 投入（commit sth to sth）",
          translation:"各行各業的人把一生的積蓄投入到他們從未見過的花上。",
          why:"空格的主詞是 people from all walks of life（各行各業的人），受詞是 their life savings（一生的積蓄），後面接 to flowers they had never seen。commit sth to sth 正是「把（資源、時間、金錢）投入到…」的固定搭配，而且前面的句子都是過去式（changed hands），所以要用過去式 committed。選項中其他動詞沒有一個能搭配「把錢投入到某物」這個雙介系詞結構。",
          notes:[{term:"commit sth to sth", pos:"v. + 搭配", gloss:"把（金錢、時間、資源）投入於（commit their life savings to flowers／commit funds to a project／commit oneself to sth 致力於）。n. commitment 投入、承諾；adj. committed 盡心盡力的（a committed teacher）。另有「犯（罪）」之義（commit a crime）與「承諾」之義（commit to doing sth）。", ex:"The firm committed millions to research last year.", exZh:"這家公司去年投入了數百萬在研究上。"},{term:"all walks of life", pos:"片語", gloss:"各行各業、社會各階層（people from all walks of life）。walk 在此是「行業、階層」的意思。相關：life savings 一生的積蓄／change hands 轉手、易主（Rare bulbs changed hands in taverns.）／plunge 暴跌（prices plunged overnight）。", ex:"The festival attracts people from all walks of life.", exZh:"這個節慶吸引了各行各業的人。"},{term:"turn A into B", pos:"片語", gloss:"flowers…turned sober merchants into reckless gamblers（花朵把冷靜的商人變成了不顧後果的賭徒）。一般班這一週第 6 題考的正是 turn into（keeps a harmless chat from turning into a heated argument），這裡是現成的例句。相關：sober 冷靜的、清醒的／reckless 不顧後果的／gambler 賭徒／be prized for sth 因…而受追捧／choked with 擠滿（＝crowded with）。"}]},

        { n:26, kind:"動詞（過去式．重創）", answer:"B", answerText:"crippled 使癱瘓、嚴重損害",
          translation:"我們被告知，這場崩盤癱瘓了荷蘭經濟，並讓數千人破產。",
          why:"空格的主詞是 The crash（崩盤），受詞是 the Dutch economy（荷蘭經濟），而且後面用 and 並列了 left thousands bankrupt（讓數千人破產），所以空格必須是一個表「重創」的及物動詞過去式。cripple 正是「使癱瘓、嚴重損害」。注意這一句用 we are told（我們被告知）插入語，暗示這只是流傳的版本，而第三段就會推翻它：the Dutch economy remained sound（經濟維持健全）。第 26 題與第 32 題剛好是一組正反對照。",
          notes:[{term:"cripple", pos:"v. / n.", gloss:"v. 使癱瘓、嚴重損害（cripple the economy／be crippled by debt）；n. 肢障者（這個名詞用法已被視為不禮貌，現代英文避免使用）。adj. crippling 造成重創的（crippling sanctions）。同義：paralyze／devastate／hobble。", ex:"The strike crippled the country's rail network.", exZh:"這場罷工癱瘓了這個國家的鐵路網。"},{term:"leave + 受詞 + 補語", pos:"句型", gloss:"left thousands bankrupt（讓數千人破產）。leave + 受詞 + 形容詞／名詞／分詞，表「使…處於某狀態」。本卷第 22 題的 leaves readers almost breathless 是同一個結構。相關：bankrupt 破產的（go bankrupt／n. bankruptcy，本篇第三段用過）。", ex:"The flood left hundreds homeless.", exZh:"這場洪水讓數百人無家可歸。"},{term:"we are told（插入語）", pos:"寫作技巧", gloss:"The crash, we are told, crippled the Dutch economy.（我們被告知，這場崩盤癱瘓了荷蘭經濟。）插入 we are told 表示「這是別人說的，作者本人不一定同意」，是學術寫作中保持距離的常用手法。同類：allegedly 據稱／supposedly 據說（本篇第二段用過）／reportedly 據報導／so the story goes 故事是這麼說的。看到這類詞就要預期作者接下來可能會推翻它。"}]},

        { n:27, kind:"片語動詞（過去式．源自）", answer:"F", answerText:"stemmed from 源自、起因於",
          translation:"這齣戲碼的大部分內容源自當時由道德家們寫下的小冊子，那些人對輕鬆得來的錢財嗤之以鼻。",
          why:"空格的主詞是 Much of the drama（這齣戲碼的大部分內容，也就是結果），後面接的是 pamphlets written at the time by moralists（當時道德家寫的小冊子，也就是來源）。所以需要一個「結果在前、來源在後」的片語，stem from 正是「源自、起因於」，與 result from 同方向。下一句 Their aim was to warn readers against greed, not to provide an accurate account（他們的目的是警告讀者遠離貪婪，而不是提供準確紀錄）也解釋了為什麼這些誇張的細節會出現。",
          notes:[{term:"stem from", pos:"片語動詞", gloss:"源自、起因於（The drama stemmed from pamphlets.／Her confidence stems from years of practice.）。n. stem 莖、幹；v. stem 阻止（stem the tide 阻止趨勢）。同義：result from／arise from／originate in／have its roots in（一般班這一週第 35 題所在的段落用的 with roots dating back to 概念相同）。注意方向：結果 + stem from + 原因。", ex:"Many misunderstandings stem from poor communication.", exZh:"許多誤解源自溝通不良。"},{term:"frown upon / warn sb against", pos:"片語", gloss:"frown upon／on sth 對…不以為然、嗤之以鼻（moralists who frowned upon easy money）／warn sb against sth 警告某人提防…（warn readers against greed）。注意 warn 的三種句型：warn sb against sth／warn sb of sth／warn sb to V。相關：pamphlet 小冊子／moralist 道德家／an accurate account 準確的敘述。", ex:"The school frowns upon the use of phones in class.", exZh:"學校不贊同在課堂上使用手機。"},{term:"not A but B（倒裝版）", pos:"句型", gloss:"Their aim was to warn readers against greed, not to provide an accurate account of events.（他們的目的是警告讀者遠離貪婪，而不是提供準確的事件紀錄。）這是把 not 放在後面的變體，前後都用不定詞保持對等。本篇最後一句 the real lesson…is not that crowds are foolish, but that a good story can outlive the facts 則是標準的 not A but B，兩個 that 子句對等。"}]},

        { n:28, kind:"片語動詞（過去式．流行起來）", answer:"G", answerText:"took off （突然）大受歡迎、起飛",
          translation:"這個故事在兩個世紀之後大為流行，當查爾斯．麥凱在他一八四一年關於「群眾的瘋狂」的暢銷書中重述了它。",
          why:"空格的主詞是 The tale（這個故事），時間是 two centuries later（兩個世紀之後），而 when 子句說明原因：Charles Mackay 把它寫進一八四一年的 bestseller（暢銷書）。所以空格要填一個表「突然流行起來」的片語動詞過去式，take off 正是此義。下一句 made it all the more memorable（讓整個故事更加令人難忘）也呼應了它廣為流傳的結果。",
          notes:[{term:"take off", pos:"片語動詞", gloss:"① （突然）大受歡迎、起飛（The tale took off.／Her career took off after that film.）② （飛機）起飛（The plane took off on time.）③ 脫下（take off your coat）④ 休假（take a day off）。本題取第一義，是最容易被忽略的用法。片語書進階篇 Unit 11~15 第 20、32 題也把 take off 放在誘答位置。", ex:"The app took off almost overnight.", exZh:"這個應用程式幾乎一夜之間就爆紅。"},{term:"all the more + 形容詞", pos:"句型", gloss:"更加（made it all the more memorable 讓它更加令人難忘／all the more important／That makes it all the more surprising.）。all the 用來加強比較級，常與表原因的片語連用。相關：supposedly 據說（a sailor who supposedly ate a priceless bulb）／mistake A for B 把 A 誤認為 B（mistaking it for an onion）。", ex:"Her calm reply made the insult all the more shocking.", exZh:"她平靜的回答讓那句侮辱更加令人震驚。"},{term:"mistake A for B", pos:"片語", gloss:"把 A 誤認為 B（mistaking it for an onion／I mistook her for her sister.）。三態 mistake-mistook-mistaken；adj. mistaken 錯誤的（be mistaken about sth）。注意介系詞是 for，不是 as 也不是 to。同義：take A for B／confuse A with B。", ex:"Visitors often mistake the museum for a church.", exZh:"遊客常把這座博物館誤認為教堂。"}]},

        { n:29, kind:"動詞（原形．欣然接受）", answer:"C", answerText:"embrace 欣然接受、擁抱",
          translation:"看來維多利亞時代的讀者非常樂於欣然接受一個貪婪迅速受到懲罰的故事。",
          why:"空格前面是 were all too happy to，所以要填原形動詞；受詞是 a tale in which greed is swiftly punished（一個貪婪迅速受到懲罰的故事）。embrace 當動詞除了「擁抱」之外，更常用於「欣然接受（想法、變化、說法）」，正好表達維多利亞讀者樂於相信這個道德寓言。語意上也與前文「道德家寫小冊子警告貪婪」一脈相承。",
          notes:[{term:"embrace", pos:"v. / n.", gloss:"① 欣然接受、擁護（embrace a tale／embrace change／embrace new technology）② 擁抱（embrace her warmly）③ 包含（The term embraces several meanings.）。考試最常考第一義，受詞多為抽象的想法或變化。同義：welcome／accept wholeheartedly／take to。", ex:"The company was quick to embrace remote working.", exZh:"這家公司很快就欣然接受了遠距工作。"},{term:"all too + 形容詞", pos:"片語", gloss:"太過、實在太（were all too happy to embrace／all too familiar 實在太熟悉／all too often 太常發生）。注意 all too 帶有「過度、不太妙」的語氣，暗示作者對此有保留，正好配合本篇質疑傳說的立場。對照 only too happy to V（非常樂意，語氣單純正面）。", ex:"The warning signs were all too clear in hindsight.", exZh:"事後看來，那些警訊實在太明顯了。"},{term:"in which（關係代名詞 + 介系詞）", pos:"句型", gloss:"a tale in which greed is swiftly punished（一個貪婪在其中迅速受到懲罰的故事）＝a tale where greed is swiftly punished。介系詞 + which 的結構後面接完整子句，比用 that 更正式。注意介系詞後面不可用 that。本卷第 16 題考的 where 與這裡的 in which 功能相同，兩題可以並看。", ex:"This is a field in which progress is slow.", exZh:"這是一個進展緩慢的領域。"}]},

        { n:30, kind:"動詞（原形．追溯）", answer:"H", answerText:"trace 追溯、追查",
          translation:"當 Anne Goldgar 著手把這個傳說追溯回它的源頭時，她花了好幾年梳理荷蘭的檔案。",
          why:"空格前面是 set out to（著手開始做），所以要填原形動詞；受詞是 the legend（這個傳說），後面接 back to its sources（回到它的源頭）。trace sth back to sth 正是「把…追溯到…」的固定搭配。語意上她 spent years combing through Dutch archives（花了好幾年梳理荷蘭檔案）也正是追溯史料的工作。",
          notes:[{term:"trace sth back to sth", pos:"v. + 搭配", gloss:"把…追溯到（trace the legend back to its sources／trace the custom back to the Ming Dynasty）；也作「追查」（trace a phone call）與「描摹」。n. trace 痕跡（without a trace 消失得無影無蹤／traces of blood）。同義：track down／date back to（一般班這一週第 35 題筆記整理過）。", ex:"Historians traced the painting back to a Florentine workshop.", exZh:"歷史學家把這幅畫追溯到一間佛羅倫斯的工坊。"},{term:"set out to V", pos:"片語動詞", gloss:"著手開始做、打算做（set out to trace the legend／set out to prove them wrong）。也作「出發」（set out at dawn）。同義：set about V-ing（注意接動名詞）／embark on sth。片語書進階篇 Unit 11~15 第 21、22、32 題都把 set about 放在誘答位置，考的正是它後面要接動名詞。", ex:"She set out to change how the subject is taught.", exZh:"她著手要改變這個科目的教法。"},{term:"Only through…have scholars been able to…（倒裝）", pos:"句型", gloss:"Only through careful historical research have scholars been able to separate fact from fiction.（唯有透過仔細的歷史研究，學者們才得以把事實與虛構區分開來。）Only + 介系詞片語置於句首時，主詞與助動詞要倒裝（have scholars been）。同類：Only then did I realize…／Only after the storm did we go out。本卷第 24 題考的補語倒裝與這裡的 Only 倒裝可以合併整理。", ex:"Only with practice can fluency be achieved.", exZh:"唯有透過練習才能達到流利。"}]},

        { n:31, kind:"形容詞（嚴重程度）", answer:"D", answerText:"grave 嚴重的、重大的",
          translation:"換句話說，損害遠比這個傳說所暗示的要輕微得多。",
          why:"空格前面是 far less，所以要填形容詞原級構成比較結構（far less ______ than…）。主詞是 The damage（損害），而前一句說 the trade involved only a relatively small number of people, with many of the major traders wealthy enough to absorb their losses（只牽涉少數人，而且主要交易者富有到足以吸收損失），所以損害「遠不如傳說中那麼嚴重」。grave 正是「嚴重的、重大的」，用於形容後果或局勢。",
          notes:[{term:"grave", pos:"adj. / n.", gloss:"adj. 嚴重的、重大的、嚴肅的（grave damage／a grave mistake／a grave concern／look grave 面色凝重）／n. 墳墓（visit a grave）。adv. gravely 嚴重地。同義（嚴重）：serious／severe／dire。注意這個字同時是「墳墓」，一詞兩義容易誤讀。", ex:"The report raised grave doubts about the project.", exZh:"這份報告對這個專案提出了嚴重的質疑。"},{term:"far less + 原級 + than", pos:"句型", gloss:"遠不如…那麼（far less grave than the legend suggests）。less + 原級 + than 表「不如」，而 far／much／a lot 用來加強程度。對照 far more + 原級 + than（遠比…更）與 far + 比較級（far greater）。注意 less 後面接的是形容詞「原級」，不可寫成 far less graver。", ex:"The side effects were far less severe than expected.", exZh:"副作用遠比預期的輕微。"},{term:"absorb / comb through", pos:"v.", gloss:"absorb 吸收、承受（absorb their losses 吸收損失／absorb information／absorb the shock）／comb through sth 仔細梳理、逐一翻查（comb through Dutch archives）。相關：archive 檔案、檔案館（多用複數 archives）／separate fact from fiction 把事實與虛構區分開來／a relatively small number of 相對少數的。", ex:"Investigators combed through thousands of emails.", exZh:"調查人員逐一翻查了數千封電子郵件。"}]},

        { n:32, kind:"形容詞（健全）", answer:"E", answerText:"sound 健全的、穩固的",
          translation:"荷蘭經濟遠非崩潰，反而維持健全，並持續繁榮了數十年。",
          why:"空格前面是 remained（維持），所以要填形容詞當主詞補語；主詞是 the Dutch economy（荷蘭經濟），而句首的 Far from collapsing（遠非崩潰）與句尾的 kept flourishing for decades（持續繁榮數十年）都指向正面的狀態。sound 當形容詞正是「健全的、穩固的」，常與 economy／finances／judgment 搭配。這一題與第 26 題的 crippled 剛好是全篇的正反對照：傳說說經濟被癱瘓，事實是經濟依然健全。",
          notes:[{term:"sound", pos:"adj. / v. / n.", gloss:"adj. 健全的、穩固的、合理的（a sound economy／sound advice／sound judgment／sound sleep 熟睡）／v. 聽起來（It sounds great.）／n. 聲音。本題考的是最容易被忽略的形容詞用法，因為學生最熟悉的是「聲音」與「聽起來」。同義（健全）：solid／robust／healthy。", ex:"The company's finances remain fundamentally sound.", exZh:"這家公司的財務基本上依然健全。"},{term:"Far from + V-ing / N", pos:"句型", gloss:"遠非、完全不（Far from collapsing, the Dutch economy remained sound.／Far from being a failure, it was a turning point.）。放句首表強烈否認前面的印象，後面接動名詞或名詞。同義：Rather than／Instead of／By no means。這個句型在推翻既有說法時非常好用，正是本篇的寫作任務。", ex:"Far from solving the problem, the new rule made it worse.", exZh:"這項新規定遠非解決問題，反而讓情況更糟。"},{term:"outlive", pos:"v.", gloss:"活得比…久、比…持久（a good story can outlive the facts／She outlived her husband by twenty years.）。字首 out- 表「超過、勝過」：outlive 活得更久／outnumber 數量超過／outperform 表現勝過／outweigh 重要性勝過。本篇最後一句用 outlive 收尾（一個好故事可以活得比事實更久），是很有力的結論。", ex:"The myth has outlived every attempt to correct it.", exZh:"這個迷思活得比每一次糾正它的嘗試都久。"}]}
      ]
    }]
  },
  {
    id:"mix", label:"混合題",
    groups:[{
      passage:`Whether you enjoy the rich taste of coffee or the striking appearance of a colorful cake, tiramisu and red velvet cake are two beloved desserts that have gained fans all over the world. Though they come from different countries, both treats have unique histories, eye-catching looks, and rich flavors that make them stand out on menus everywhere.

【Tiramisu】Tiramisu is a classic Italian dessert that features alternating layers of espresso-soaked ladyfingers and a creamy mascarpone mixture, with a dusting of cocoa powder on top. Some versions also include a splash of sweet liqueur for an added kick. The modern version of this dessert is believed to have originated in the city of Treviso around the late 1960s or early 1970s. Its name means "pick me up" in the local dialect, possibly in reference to the energizing effects of its ingredients. Le Beccherie, a restaurant in Treviso, is often credited with creating the original recipe. Over the years, tiramisu has appeared not only in Italian restaurants but also in cafés and bakeries around the globe. Creative versions like matcha tiramisu in Japan and mango tiramisu in India have added to its worldwide fame. It even has a special day dedicated to it, World Tiramisu Day, and a special version was once prepared for an Italian astronaut to enjoy in space.

【Red Velvet Cake】Red velvet cake, on the other hand, is a colorful and visually appealing dessert from the United States, with roots dating back to the early twentieth century. Its name comes from its deep red color and soft, velvety texture. Early recipes got their reddish tint from a natural reaction between cocoa powder and acidic ingredients such as buttermilk, but many modern versions use red food coloring for a brighter look. The cake became especially popular in the 1940s and 1950s, then faded for a while before returning to the spotlight thanks to movies, TV shows, and social media. Red velvet cake is strongly associated with Valentine's Day and celebrations of love, thanks to its rich red color, which symbolizes passion and joy. It's commonly served on Valentine's Day, Christmas, and even at weddings, making it a timeless favorite for romantic occasions. Its sweet, slightly tangy flavor and smooth cream cheese frosting have helped make it a lasting dessert classic.`,
      zh:`不論你喜愛的是咖啡濃郁的滋味，還是一塊色彩繽紛蛋糕的亮眼外型，提拉米蘇和紅絲絨蛋糕都是兩款在全世界擁有擁護者的受歡迎甜點。雖然它們來自不同的國家，兩款甜點都有獨特的歷史、吸睛的外觀，以及濃厚的風味，讓它們在各地的菜單上格外突出。

【提拉米蘇】提拉米蘇是一款經典的義大利甜點，特色是浸過濃縮咖啡的手指餅乾與綿密的馬斯卡彭乳酪餡交錯疊層，上面再撒上一層可可粉。有些版本還會加入少量甜味香甜酒增添一點勁道。這款甜點的現代版本一般認為起源於特雷維索市，大約在一九六○年代末或一九七○年代初。它的名字在當地方言中意思是「把我提起來」，可能是在指它的食材所帶來的提振效果。特雷維索的一家餐廳 Le Beccherie 常被認為是創造出原始配方的功勞者。多年來，提拉米蘇不只出現在義大利餐廳，也出現在全球各地的咖啡館與烘焙坊。像日本的抹茶提拉米蘇、印度的芒果提拉米蘇這類創意版本，更增添了它在全世界的名氣。它甚至有一個專屬的紀念日，世界提拉米蘇日，而且還曾經有特製的版本被準備給一位義大利太空人在太空中享用。

【紅絲絨蛋糕】另一方面，紅絲絨蛋糕是一款來自美國、色彩繽紛且視覺上十分吸引人的甜點，其根源可追溯到二十世紀初。它的名字來自它深紅的顏色與柔軟如絲絨的質地。早期的配方是靠可可粉與白脫牛奶等酸性食材之間的天然反應來取得偏紅的色調，但許多現代版本為了更明亮的外觀而使用紅色食用色素。這款蛋糕在一九四○與一九五○年代特別受歡迎，之後沉寂了一段時間，後來靠著電影、電視節目與社群媒體重回聚光燈下。紅絲絨蛋糕與情人節以及各種愛的慶典有強烈的連結，這要歸功於它濃郁的紅色，象徵著熱情與喜悅。它常在情人節、聖誕節，甚至婚禮上供應，使它成為浪漫場合歷久不衰的最愛。它甜中帶微酸的風味與滑順的奶油乳酪糖霜，讓它成為一款經久不墜的甜點經典。`,
      questions:[
        { n:33, kind:"混合題（選詞填空＋字形變化）",
          prompt:"請根據選文內容，從文章中選出兩個單詞，分別填入下列句子空格，並視句型結構需要作適當的字形變化，使句子語意完整、語法正確，且符合全文文意。每格限填一個單詞(word)。",
          stem:"A restaurant in Italy is often given ____(1)____ for creating tiramisu with its rich layers and perfect balance of coffee and cream. Meanwhile, the American red velvet cake has become a(n) ____(2)____ of celebration and romance. Both desserts hold cultural significance and continue to delight people with their unique textures and flavors.",
          answers:[
            {k:"(1)", w:"credit", note:"原文 credited（動詞）→ 名詞 credit"},
            {k:"(2)", w:"symbol", note:"原文 symbolizes（動詞）→ 名詞 symbol"}
          ],
          evidence:"is often credited with creating the original recipe",
          translation:"義大利的一家餐廳常被歸予創造出提拉米蘇的功勞，這款甜點有著濃厚的層次與咖啡與奶香的完美平衡。同時，美國的紅絲絨蛋糕已經成為慶祝與浪漫的象徵。兩款甜點都具有文化意義，並持續以它們獨特的口感與風味取悅人們。",
          why:"第 (1) 格：題目句是 is often given ______ for creating tiramisu，對應原文 Le Beccherie…is often credited with creating the original recipe（常被認為是創造原始配方的功勞者）。原文的 credited 是動詞，但題目句已經有動詞 is given，所以空格要填名詞受詞，必須把 credited 改成名詞 credit（give sb credit for sth 把…的功勞歸給某人）。第 (2) 格：題目句是 has become a(n) ______ of celebration and romance，對應原文 its rich red color, which symbolizes passion and joy（象徵熱情與喜悅）。原文的 symbolizes 是動詞，但空格前面有冠詞 a(n)、後面接 of，所以要填名詞 symbol（a symbol of sth）。兩格考的都是「動詞改名詞」，而且冠詞 a(n) 與介系詞 of 就是最明確的提示。",
          notes:[{term:"give sb credit for sth", pos:"片語", gloss:"把…的功勞歸給某人（be given credit for sth／be credited with sth／take credit for sth 把功勞歸於自己／to sb's credit 值得讚許的是）。本卷第 6 題把 credit 放在誘答位置（答案是 impact），而一般班這一週第 11 題考的正是 give…the credit for 這個搭配，兩卷可以並看。credit 的三種意思值得整組整理：① 功勞、讚譽 ② 信用、賒帳（buy on credit）③ 學分。", ex:"She was finally given credit for the discovery.", exZh:"她終於因這項發現而獲得肯定。"},{term:"a symbol of sth", pos:"片語", gloss:"…的象徵（a symbol of celebration／a symbol of peace／a status symbol 身分象徵）。v. symbolize 象徵（which symbolizes passion and joy）；adj. symbolic 象徵性的。混合題的字形變化最常考的就是這種「動詞↔名詞」的轉換，判斷依據是空格前後的冠詞與介系詞。", ex:"The olive branch has long been a symbol of peace.", exZh:"橄欖枝長久以來一直是和平的象徵。"},{term:"混合題字形變化的解題步驟", pos:"解題技巧", gloss:"① 先找出題目句與原文對應的那一句，鎖定「同一個字根」的字。② 看空格「前後的文法線索」決定詞性：前面有 a/an/the 或後面接 of → 填名詞；前面有 be 動詞或助動詞 → 填動詞或分詞；前面有 very／副詞，或後面接名詞 → 填形容詞；修飾動詞 → 填副詞。③ 最後檢查單複數與時態。本題兩格都是靠冠詞與介系詞判斷出要填名詞。"}]},

        { n:34, kind:"混合題（找出同義片語）",
          prompt:"Which phrase in the above passage carries the meaning of \"to be noticeably different or easy to see because of being special or impressive\"?",
          answerText:"stand out",
          evidence:"make them stand out on menus everywhere",
          translation:"上文中哪一個片語帶有「因為特別或令人印象深刻而明顯不同、容易被看見」的意思？",
          why:"題目給的英文定義 to be noticeably different or easy to see because of being special or impressive（因為特別或令人印象深刻而顯得明顯不同、容易被看見）正是 stand out（突出、脫穎而出）的意思。原文出現在第一段的最後：both treats have unique histories, eye-catching looks, and rich flavors that make them stand out on menus everywhere（兩款甜點都有獨特的歷史、吸睛的外觀與濃厚的風味，讓它們在各地菜單上格外突出）。注意題目問的是 phrase（片語），所以答案要寫兩個字的 stand out，不能只寫 stand，也不要把題幹的 make them 一起抄進去。",
          notes:[{term:"stand out", pos:"片語動詞", gloss:"突出、顯眼、脫穎而出（stand out from the crowd／stand out on menus／stand out as the best candidate）。adj. outstanding 傑出的；n. standout 出色的人或物。同義：be conspicuous／catch the eye／be noticeable。片語書進階篇 Unit 11~15 第 14 題考的正是 stand out，兩份考卷可以互相對照。", ex:"Her essay stood out among hundreds of entries.", exZh:"她的文章在數百份作品中格外突出。"},{term:"找同義字詞題的解題步驟", pos:"解題技巧", gloss:"① 先把題目給的英文定義「翻成中文」，抓出核心概念（本題：明顯、容易被看見、因為很特別）。② 注意題目問的是 word 還是 phrase：問 phrase 就要找兩個字以上的片語，問 word 就只能填一個字。③ 回文章掃描語意相符的位置，優先找形容整體特色的句子（通常在第一段或結論）。④ 答案要照原文抄寫，但要調整成題目要求的形式（本題原文是 make them stand out，只取 stand out）。"},{term:"stand 家族", pos:"整理", gloss:"stand out 突出／stand up for 捍衛／stand up to 抵抗、經得起／stand up against 挺身對抗／stand by 支持、待命／stand for 代表、容忍／stand a chance 有機會。片語書進階篇 Unit 11~15 把這一組考了好幾次，可以合併複習。"}]},

        { n:35, kind:"混合題（多選．比較異同）",
          prompt:"Which of the following statements correctly compare tiramisu and red velvet cake?（複選，共兩個答案）",
          options:{
            A:"Tiramisu is usually served cold, while red velvet cake is often served warm. 提拉米蘇通常冷食，而紅絲絨蛋糕常溫熱供應。",
            B:"Tiramisu has inspired variations in other countries, while red velvet cake has regained popularity through media exposure. 提拉米蘇在其他國家激發了變化版本，而紅絲絨蛋糕則透過媒體曝光重獲人氣。",
            C:"Tiramisu is for romantic occasions, while red velvet cake is more associated with everyday dining. 提拉米蘇適用於浪漫場合，而紅絲絨蛋糕較常與日常用餐連結。",
            D:"Tiramisu has been around longer than red velvet cake. 提拉米蘇存在的時間比紅絲絨蛋糕更久。",
            E:"Both originated in Europe and are linked to traditional celebrations. 兩者都源自歐洲，並與傳統慶典有關。",
            F:"Both desserts have distinctive flavors and visually appealing appearances. 兩款甜點都有獨特的風味與吸引人的外觀。"
          },
          multi:["B","F"],
          answers:[
            {k:"(B)", w:"Tiramisu has inspired variations in other countries, while red velvet cake has regained popularity through media exposure.", note:"日本抹茶、印度芒果版本 ↔ 電影、電視、社群媒體"},
            {k:"(F)", w:"Both desserts have distinctive flavors and visually appealing appearances.", note:"第一段即點出 rich flavors 與 eye-catching looks"}

          evidence:"both treats have unique histories, eye-catching looks, and rich flavors",
          translation:"下列哪些敘述正確地比較了提拉米蘇與紅絲絨蛋糕？",
          explain:{
            B:"✔ 兩半都有明確依據。前半對應 Creative versions like matcha tiramisu in Japan and mango tiramisu in India have added to its worldwide fame（日本的抹茶提拉米蘇、印度的芒果提拉米蘇這類創意版本增添了它的世界名氣）；後半對應 then faded for a while before returning to the spotlight thanks to movies, TV shows, and social media（沉寂一段時間後靠電影、電視與社群媒體重回聚光燈下），media exposure 正是 movies, TV shows, and social media 的概括。",
            F:"✔ 文章第一段就直接寫明 both treats have unique histories, eye-catching looks, and rich flavors（兩款甜點都有獨特的歷史、吸睛的外觀與濃厚的風味）。distinctive flavors 對應 rich flavors，visually appealing appearances 對應 eye-catching looks，而紅絲絨那段也用了 visually appealing 這個詞。",
            A:"✘ 文章從頭到尾沒有提到任何一款甜點的供應溫度。提拉米蘇段落只說它有浸咖啡的手指餅乾與馬斯卡彭餡，紅絲絨段落只說它的顏色、質地與糖霜，兩段都沒有 cold 或 warm 的資訊。這是典型的「文章未提及」陷阱，不能用生活常識補上。",
            C:"✘ 正好說反了。文章說的是紅絲絨蛋糕 is strongly associated with Valentine's Day and celebrations of love…a timeless favorite for romantic occasions（與情人節和愛的慶典強烈連結，是浪漫場合歷久不衰的最愛），所以浪漫場合是紅絲絨而不是提拉米蘇；而文章也沒有說紅絲絨與日常用餐有關。這是「把兩個對象的特徵互換」的陷阱。",
            D:"✘ 時間資訊剛好相反。提拉米蘇的現代版本 is believed to have originated…around the late 1960s or early 1970s（一九六○年代末或一九七○年代初），而紅絲絨蛋糕 with roots dating back to the early twentieth century（根源可追溯到二十世紀初）。所以紅絲絨比提拉米蘇更早，不是更晚。",
            E:"✘ 前半就錯了：提拉米蘇來自義大利（歐洲），但紅絲絨蛋糕明確寫著 a…dessert from the United States（來自美國），不是歐洲。只要有一半不符，整個選項就不能選，這是複選題最常見的失分點。"
          },
          notes:[{term:"比較異同型複選題的解題步驟", pos:"解題技巧", gloss:"① 先把兩欄的特徵分別列成筆記（來源國、年代、外觀、風味、場合、流行軌跡）。② 逐一檢查選項時，把每個選項「切成兩半」分別驗證，因為命題者最常在其中一半動手腳（本題的 (E) 就是前半錯、後半看似合理）。③ 注意三種典型陷阱：文章未提及（本題的 (A)）、特徵互換（本題的 (C)）、時間或數據方向相反（本題的 (D)）。④ 複選題要選到題目指定的數量才算完整，本題配分 4%、每個答案 2%，所以是兩個答案。"},{term:"date back to", pos:"片語", gloss:"追溯到、始於（roots dating back to the early twentieth century／The custom dates back to the Ming Dynasty.）。注意沒有被動語態，不說 be dated back to。同義：go back to／originate in／have its origins in。", ex:"The temple dates back to the twelfth century.", exZh:"這座寺廟可追溯到十二世紀。"},{term:"be credited with / be associated with", pos:"整理", gloss:"be credited with sth 被認為是…的功勞者（Le Beccherie is often credited with creating the original recipe.）／be associated with sth 與…有連結（Red velvet cake is strongly associated with Valentine's Day.）。兩個都是本篇出現的被動片語，而且都是閱讀題考細節時最常被改寫的句子，值得畫記。相關：be dedicated to sth 專門獻給／be reserved for sth 留作…之用。"}]}
      ]
    }]
  },

          answerText:"To avoid exhaustion, people should arrange / plan their schedules in advance.",
          why:"全句分三個計分段落。① 為了避免精疲力竭 → To avoid exhaustion（不定詞表目的；「精疲力竭」用名詞 exhaustion，也可寫 burnout）。注意 avoid 後面若接動作要用動名詞（avoid being exhausted），但這裡接名詞最簡潔。② 人們應該安排自己的時間表 → people should arrange / plan their schedules（schedule 是可數名詞，主詞是複數 people 所以用複數 schedules；動詞 arrange 與 plan 都可接受）。③ 提前 → in advance（置於句尾）。常見錯誤：寫成 For avoid exhaustion（for 後面不能接原形動詞）、advance 前面漏掉 in、或把 schedule 寫成不可數而漏掉 s。",
          notes:[{term:"to avoid + N / V-ing", pos:"句型", gloss:"為了避免（To avoid exhaustion／To avoid being late, she set two alarms.）。avoid 後面接名詞或動名詞，不接不定詞（不說 avoid to be late）。同義表目的：in order to V／so as to V／so that + 子句。常見同類動詞也接動名詞：enjoy／mind／finish／quit／suggest／consider。", ex:"To avoid delays, submit the form online.", exZh:"為了避免延誤，請線上提交表單。"},{term:"in advance", pos:"片語", gloss:"事先、提前（arrange their schedules in advance／book in advance／two weeks in advance）。同義：beforehand／ahead of time。本卷第三篇文章就有現成的句子：begins announcing each person's death one week in advance（提前一週宣告每個人的死期），一邊考閱讀一邊考翻譯，剛好可以並看。注意 in 不可省略。", ex:"Please confirm your attendance in advance.", exZh:"請事先確認您是否出席。"},{term:"exhaustion", pos:"n.", gloss:"精疲力竭、耗盡（physical exhaustion／suffer from exhaustion）。adj. exhausted 感到精疲力竭的（主詞是人）／exhausting 令人精疲力竭的（主詞是事）；v. exhaust 耗盡、使疲憊。相關：burnout 身心俱疲、過勞（職場語境常用）／schedule 時間表（v. 安排；美式發音 /ˈskedʒuːl/，英式 /ˈʃedjuːl/）。", ex:"After the marathon she collapsed from sheer exhaustion.", exZh:"馬拉松結束後她因為極度疲憊而倒下。"}]},

          why:"全句分五個計分段落。① 相反地 → Instead（句首加逗號；此處是「不這樣做，反而那樣做」的替代關係，所以用 Instead 而不是 On the contrary）。② 許多人縱情於 → many people indulge in（indulge in sth 縱情於、沉溺於，介系詞 in 不可省略）。③ 不必要的活動 → unnecessary activities（複數）。④ 並把重要工作拖到 → and leave / put off important tasks（put off 拖延，受詞若是代名詞要放中間：put it off）。⑤ 深夜才做 → until late at night（用 until 表「一直拖到…」）。常見錯誤：indulge 後面漏掉 in、把 Instead 寫成 On the contrary（語氣不同）、或把 until 寫成 to。",
          notes:[{term:"indulge in", pos:"片語動詞", gloss:"縱情於、沉溺於（indulge in unnecessary activities／indulge in luxury／indulge in self-pity）；indulge sb 寵溺某人；adj. indulgent 縱容的；n. indulgence。本卷第 23 題的答案正是 indulge in，而那一句 others indulge in every pleasure they can find before their final day 就是現成例句，可以直接拿給學生看。", ex:"On weekends he indulges in long afternoon naps.", exZh:"週末他會縱情於長長的午睡。"},{term:"put off / leave sth until…", pos:"片語動詞", gloss:"put off 拖延、延期（put off important tasks／put off the meeting until next week；受詞是代名詞時要放中間：put it off）／leave sth until… 把某事留到…（leave it until the last minute 拖到最後一刻）。同義：delay／postpone／procrastinate（v. 拖延，n. procrastination）。注意 postpone 與 put off 後面接名詞或動名詞，不接不定詞。", ex:"Don't put off seeing a doctor if the pain continues.", exZh:"如果疼痛持續，不要拖延去看醫生。"},{term:"Instead / On the contrary", pos:"辨析", gloss:"Instead 是「不做 A 而改做 B」的替代（He didn't rest. Instead, he kept working.）／On the contrary 是「事實正好相反」，用來否認前面的說法（You think it's easy? On the contrary, it's very hard.）。本題的中文「相反地」描述的是人們「該做的沒做，反而去做別的」，屬於替代關係，所以用 Instead。一般班這一週第 20 題的克漏字答案正是 Instead，兩卷可以並看。", ex:"She didn't apologize. Instead, she changed the subject.", exZh:"她沒有道歉，反而轉移了話題。"}]}

EXAM.sections.forEach(s => s.groups.forEach(g => g.questions.forEach(q => { q.__sid = s.id; allQ.push(q); })));

document.getElementById('examMeta').textContent = EXAM.meta;

let noteCount = 0;
allQ.forEach(q => noteCount += (q.notes || []).length);

const nav = document.getElementById('nav');
EXAM.sections.forEach(s => {
  const a = document.createElement('a');
  a.className = 'chip'; a.href = '#sec-' + s.id; a.textContent = s.label.replace(/^[一二三四五六]、/, m => m);
  nav.appendChild(a);
});
const noteChip = document.createElement('a');
noteChip.className = 'chip'; noteChip.href = '#side'; noteChip.textContent = '重點表 ' + noteCount;
nav.appendChild(noteChip);
const toggleAll = document.createElement('button');
toggleAll.className = 'chip solid'; toggleAll.textContent = '全部展開';
nav.appendChild(toggleAll);

function renderPassage(g, i, sid) {
  let html = esc(g.passage);
  g.questions.forEach(q => {
    if (!q.evidence) return;
    const t = esc(q.evidence);
    if (html.includes(t)) html = html.replace(t, `<span class="hl ev" data-ev="${q.n}">${t}</span>`);
  });
  html = html.replace(/__(\d+)__/g, (m, n) =>
    `<button class="blank" data-blank="${n}" aria-label="第 ${n} 題空格">${n}</button>`);
  const body = '<div class="passage">' +
    html.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, ' ') + '</p>').join('') + '</div>';
  if (!g.zh) return body;
  const id = sid + '-' + i;
  return body +
    `<button class="zhbtn" data-zh="${id}">全文中譯</button>` +
    `<div class="zhbox" id="zh-${id}">` +
      g.zh.split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g, ' ') + '</p>').join('') +
    '</div>';
}

function renderQ(q) {
  const parts = [];
  if (q.options) {
    const ks = Object.keys(q.options);
    parts.push('<div class="opts">' + ks.map(k =>
      `<div class="opt"><span class="opt-k">(${k})</span><span>${esc(q.options[k])}</span></div>`).join('') + '</div>');
  }
  const head = `<div class="q-tag"><span class="q-n">${String(q.n).padStart(2,'0')}</span><span class="q-kind">${esc(q.kind || '')}</span></div>` +
    (q.prompt ? `<p class="prompt">${esc(q.prompt)}</p>` : '') +
    (q.stem ? `<p class="stem">${esc(q.stem).replace(/\n/g,'<br>')}</p>` : '');

  let ans = '';
  if (q.answers) {
    ans = '<ul class="fills">' + q.answers.map(a =>
      `<li class="fill"><span class="fill-k">${esc(a.k)}</span><span class="fill-w hl" data-ansmulti>${esc(a.w)}</span><span class="fill-n">${esc(a.note || '')}</span></li>`).join('') + '</ul>';
  } else {
    const label = q.options ? `(${q.answer}) ${esc(wordOf(q))}` :
      (q.answer ? `(${q.answer}) ${esc(q.answerText)}` : esc(q.answerText));
    ans = `<p class="ans"><span class="ans-k">答案</span><span class="ans-v hl" data-ans="${q.n}">${label}</span></p>`;
  }

  let expl = '';
  if (q.explain) {
    expl = '<ul class="lines">' + Object.keys(q.options).map(k => {
      const right = q.multi ? q.multi.includes(k) : k === q.answer;
      return `<li class="line ${right ? 'right' : 'wrong'}"><span class="line-k">(${k})</span><span>${esc(q.explain[k] || '')}</span></li>`;
    }).join('') + '</ul>';
  }
  const why = q.why ? `<p class="why">${esc(q.why)}</p>` : '';
  const sample = q.sample ? `<div class="sample"><p class="note-h">參考範文</p>` +
    q.sample.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g,' ')}</p>`).join('') + '</div>' : '';
  const evid = q.evidence ? `<p class="evid"><span>文中依據</span>${esc(q.evidence)}</p>` : '';
  const notes = (q.notes || []).length ? `<div class="note"><p class="note-h">重點整理</p>` +
    q.notes.map(nt => `<p class="note-i"><span class="term">${esc(nt.term)}</span><span class="pos">${esc(nt.pos || '')}</span><span class="gloss">${esc(nt.gloss || '')}</span>` +
      (nt.ex ? `<span class="ex">${esc(nt.ex)}<i>${esc(nt.exZh || '')}</i></span>` : '') + '</p>').join('') + '</div>' : '';

  return `<article class="q" id="q-${q.__sid}-${q.n}" data-n="${q.n}" data-sid="${q.__sid}">
    <div class="q-top">${head}${parts.join('')}
      <button class="reveal" aria-expanded="false" aria-controls="body-${q.n}">看詳解</button>
    </div>
    <div class="body" id="body-${q.n}">
      ${ans}${q.translation ? `<p class="zh">${esc(q.translation)}</p>` : ''}${expl}${why}${evid}${sample}${notes}
    </div>
  </article>`;
}

document.getElementById('main').innerHTML = EXAM.sections.map((s, i) => `
  <section class="sec" id="sec-${s.id}">
    <div class="sec-head">
      <span class="sec-num">${String(i+1).padStart(2,'0')}</span>
      <h2 class="sec-label">${esc(s.label)}</h2>
      <span class="sec-score">${esc(s.score || '')}</span>
    </div>
    ${s.instruction ? `<p class="sec-inst">${esc(s.instruction)}</p>` : ''}
    ${s.bank ? `<div class="bank${s.bankWide ? ' wide' : ''}">${Object.keys(s.bank).map(k =>
      `<div class="bank-i" data-bank="${k}"><span>(${k})</span>${esc(s.bank[k])}</div>`).join('')}</div>` : ''}
    ${s.groups.map((g, gi) => (g.passage ? renderPassage(g, gi, s.id) : '') + g.questions.map(renderQ).join('')).join('')}
  </section>`).join('');

const items = [];
allQ.forEach(q => (q.notes || []).forEach(nt => items.push({ ...nt, n: q.n, sid: q.__sid })));
document.getElementById('side').innerHTML = `
  <p class="side-h">Notes</p>
  <p class="side-t">本卷重點 ${items.length} 則</p>
  <ul class="card-list">${items.map(nt => `
    <li class="card-item"><a href="#q-${nt.sid}-${nt.n}">
      <span class="jump">第 ${nt.n} 題</span>
      <span class="term">${esc(nt.term)}</span><span class="pos">${esc(nt.pos || '')}</span>
      <div class="gloss">${esc(nt.gloss || '')}</div>
    </a></li>`).join('')}</ul>
  <p class="side-note">點任一則可跳到出處題目。用瀏覽器列印（Ctrl／⌘ + P）會自動展開全部詳解與中譯，可直接印成講義。</p>`;

document.getElementById('foot').textContent = `共 ${allQ.length} 題 · ${EXAM.footer}`;

function setOpen(card, open) {
  card.classList.toggle('open', open);
  const btn = card.querySelector('.reveal');
  btn.setAttribute('aria-expanded', open);
  btn.firstChild.nodeValue = open ? '收合詳解' : '看詳解';
  const n = card.dataset.n;
  const sec = card.closest('.sec') || document;
  card.querySelectorAll('.hl').forEach(h => h.classList.toggle('on', open));
  const ev = sec.querySelector(`[data-ev="${n}"]`);
  if (ev) ev.classList.toggle('on', open);
  const q = findQ(n, card.dataset.sid);
  if (q && q.answer && q.answerText) {
    const bi = sec.querySelector(`[data-bank="${q.answer}"]`);
    if (bi) bi.classList.toggle('used', open);
  }
  const bl = sec.querySelector(`[data-blank="${n}"]`);
  if (bl) {
    if (open) {
      bl.classList.add('filled');
      bl.innerHTML = `<sup>${n}</sup><span class="hl">${esc(wordOf(q))}</span>`;
      requestAnimationFrame(() => bl.querySelector('.hl').classList.add('on'));
    } else {
      bl.classList.remove('filled');
      bl.textContent = n;
    }
  }
}
document.addEventListener('click', e => {
  const rv = e.target.closest('.reveal');
  if (rv) { const c = rv.closest('.q'); setOpen(c, !c.classList.contains('open')); return; }
  const zb = e.target.closest('.zhbtn');
  if (zb) { zb.classList.toggle('on'); document.getElementById('zh-' + zb.dataset.zh).classList.toggle('on'); return; }
  const bl = e.target.closest('.blank');
  if (bl) {
    const n = bl.dataset.blank;
    const sec = bl.closest('.sec');
    const c = (sec && sec.querySelector('.q[data-n="' + n + '"]'))
           || document.querySelector('.q[data-n="' + n + '"]');
    if (!c) return;
    if (!c.classList.contains('open')) setOpen(c, true);
    c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
});
toggleAll.addEventListener('click', () => {
  const open = toggleAll.textContent === '全部展開';
  document.querySelectorAll('.q').forEach(c => setOpen(c, open));
  toggleAll.textContent = open ? '全部收合' : '全部展開';
});
window.addEventListener('beforeprint', () => {
  document.querySelectorAll('.q').forEach(c => setOpen(c, true));
  document.querySelectorAll('.zhbox').forEach(b => b.classList.add('on'));
  toggleAll.textContent = '全部收合';
});
</script>
</body>
</html>
